<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d">
  <title id="t">How a request moves through Conduit</title>
  <desc id="d">Seven stages in order: accept, gate, protect, auth, shape, serve, respond. A guard that rejects a request answers it immediately and the later stages do not run.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 14.5px; font-weight: 600; }
      .s { font-size: 12.5px; fill: #3d444d; }
      .m { font-size: 12.5px; fill: #57606a; }
      .n { font-size: 12px; font-weight: 700; fill: #ffffff; }
      .ln { stroke: #57606a; stroke-width: 1.7; fill: none; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="299" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>

  <rect x="19" y="62" width="118" height="166" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <circle cx="36" cy="82" r="10" fill="#57606a"/><text x="36" y="86.5" text-anchor="middle" class="n">1</text>
  <text x="52" y="87" class="h">Accept</text>
  <text x="31" y="118" class="s">TLS</text>
  <text x="31" y="140" class="s">HTTP/1.1, /2</text>
  <text x="31" y="162" class="s">request ID</text>
  <path class="ln" d="M139 145 H151" marker-end="url(#arr)"/>
  <rect x="153" y="62" width="118" height="166" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.4"/>
  <circle cx="170" cy="82" r="10" fill="#57606a"/><text x="170" y="86.5" text-anchor="middle" class="n">2</text>
  <text x="186" y="87" class="h">Gate</text>
  <text x="165" y="118" class="s">IP allow / deny</text>
  <text x="165" y="140" class="s">CORS preflight</text>
  <text x="165" y="162" class="s">health check</text>
  <path class="ln" d="M273 145 H285" marker-end="url(#arr)"/>
  <rect x="287" y="62" width="118" height="166" rx="10" fill="#fff1e5" stroke="#f5a35c" stroke-width="1.4"/>
  <circle cx="304" cy="82" r="10" fill="#57606a"/><text x="304" y="86.5" text-anchor="middle" class="n">3</text>
  <text x="320" y="87" class="h">Protect</text>
  <text x="299" y="118" class="s">allowed hosts</text>
  <text x="299" y="140" class="s">request limits</text>
  <text x="299" y="162" class="s">rate limit</text>
  <path class="ln" d="M407 145 H419" marker-end="url(#arr)"/>
  <rect x="421" y="62" width="118" height="166" rx="10" fill="#fff1e5" stroke="#f5a35c" stroke-width="1.4"/>
  <circle cx="438" cy="82" r="10" fill="#57606a"/><text x="438" y="86.5" text-anchor="middle" class="n">4</text>
  <text x="454" y="87" class="h">Auth</text>
  <text x="433" y="118" class="s">consumers</text>
  <text x="433" y="140" class="s">Basic auth</text>
  <text x="433" y="162" class="s">API key</text>
  <text x="433" y="184" class="s">JWT</text>
  <text x="433" y="206" class="s">forward auth</text>
  <path class="ln" d="M541 145 H553" marker-end="url(#arr)"/>
  <rect x="555" y="62" width="118" height="166" rx="10" fill="#fbefff" stroke="#c297ff" stroke-width="1.4"/>
  <circle cx="572" cy="82" r="10" fill="#57606a"/><text x="572" y="86.5" text-anchor="middle" class="n">5</text>
  <text x="588" y="87" class="h">Shape</text>
  <text x="567" y="118" class="s">redirects</text>
  <text x="567" y="140" class="s">fault injection</text>
  <text x="567" y="162" class="s">Rhai / WASM</text>
  <text x="567" y="184" class="s">scripts</text>
  <path class="ln" d="M675 145 H687" marker-end="url(#arr)"/>
  <rect x="689" y="62" width="118" height="166" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.4"/>
  <circle cx="706" cy="82" r="10" fill="#57606a"/><text x="706" y="86.5" text-anchor="middle" class="n">6</text>
  <text x="722" y="87" class="h">Serve</text>
  <text x="701" y="118" class="s">static files</text>
  <text x="701" y="140" class="s">reverse proxy</text>
  <text x="701" y="162" class="s">TCP / upload</text>
  <text x="701" y="184" class="s">fallback</text>
  <path class="ln" d="M809 145 H821" marker-end="url(#arr)"/>
  <rect x="823" y="62" width="118" height="166" rx="10" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.4"/>
  <circle cx="840" cy="82" r="10" fill="#57606a"/><text x="840" y="86.5" text-anchor="middle" class="n">7</text>
  <text x="856" y="87" class="h">Respond</text>
  <text x="835" y="118" class="s">strip CR / LF</text>
  <text x="835" y="140" class="s">header rules</text>
  <text x="835" y="162" class="s">transforms</text>
  <text x="835" y="184" class="s">compression</text>
  <text x="835" y="206" class="s">log, metrics</text>
  <text x="480" y="36" text-anchor="middle" class="h">Request to response, in this order</text>
  <text x="480" y="258" text-anchor="middle" class="m">A guard that rejects a request answers it right there (403, 401, 429 …); the stages after it do not run.</text>
  <text x="480" y="278" text-anchor="middle" class="m">Health checks (/__health__) are answered at the end of stage 2, before the host check, limits, auth and the rest.</text>
</svg>
