<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" role="img" aria-labelledby="t d">
  <title id="t">Balancing and resilience</title>
  <desc id="d">Requests reach a balancer that picks an upstream with one of eight strategies. Upstreams that fail active health checks or are ejected by outlier detection are skipped, upstreams at their connection cap are skipped by the circuit breaker, and a failed attempt is retried on another target within a retry budget.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--blue)"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--green)"/></marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--orange)"/></marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--purple)"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--red)"/></marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--gray)"/></marker>
    <style>
svg { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --faint:#8c959f;
  --blue:#0969da; --blue-s:#ddf4ff; --green:#1a7f37; --green-s:#dafbe1; --orange:#bc4c00; --orange-s:#fff1e5;
  --purple:#8250df; --purple-s:#fbefff; --red:#cf222e; --red-s:#ffebe9; --gray:#59636e; --gray-s:#eaeef2; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --card:#161b22; --line:#3d444d; --text:#f0f6fc; --muted:#9198a1; --faint:#6e7681;
    --blue:#4493f8; --blue-s:#10233f; --green:#3fb950; --green-s:#102a1a; --orange:#e3893b; --orange-s:#33200d;
    --purple:#ab7df8; --purple-s:#241b3d; --red:#f85149; --red-s:#3a1618; --gray:#9198a1; --gray-s:#21262d; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.m { font-size: 12.5px; fill: var(--muted); }
.s { font-size: 11.5px; fill: var(--muted); }
.b { font-size: 14px; font-weight: 600; }
.h { font-size: 15.5px; font-weight: 700; }
.xl { font-size: 22px; font-weight: 700; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ka { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--a); font-weight: 600; }
.acc { fill: var(--a); }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--a); }
.panel { fill: var(--bg); stroke: var(--line); }
.card { fill: var(--card); stroke: var(--line); }
.cardA { fill: var(--card); stroke: var(--a); }
.soft { fill: var(--s); stroke: var(--a); }
.fillS { fill: var(--s); stroke: none; }
.zone { fill: var(--s); stroke: var(--a); stroke-dasharray: none; opacity: 1; }
.zoneD { fill: none; stroke: var(--faint); stroke-dasharray: 5 4; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lnA { fill: none; stroke: var(--a); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 5 4; }
.ico { fill: none; stroke: var(--a); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icoF { fill: var(--a); stroke: var(--a); stroke-width: 1.2; stroke-linejoin: round; }
.num { fill: var(--a); }
.numt { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.chip { fill: var(--s); stroke: var(--a); }
.chipt { font-size: 11.5px; font-weight: 600; fill: var(--a); text-anchor: middle; }
.blue { --a: var(--blue); --s: var(--blue-s); }
.green { --a: var(--green); --s: var(--green-s); }
.orange { --a: var(--orange); --s: var(--orange-s); }
.purple { --a: var(--purple); --s: var(--purple-s); }
.red { --a: var(--red); --s: var(--red-s); }
.gray { --a: var(--gray); --s: var(--gray-s); }
</style>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="959" height="565" rx="16"/>
  <rect class="card" x="20" y="150" width="120" height="60" rx="10"/>
  <g class="gray" transform="translate(32 162) scale(0.917)"><g class="ico"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18c-3-3-3-15 0-18z"/></g></g>
  <text x="62" y="178" class="b">Requests</text>
  <text x="62" y="196" class="s">from clients</text>
  <g class="blue"><path class="lnA" d="M142 180 L178 180" marker-end="url(#ar-blue)"/></g>
  <g class="blue"><rect class="soft" x="180" y="30" width="270" height="334" rx="14"/></g>
  <g class="blue" transform="translate(198 44) scale(0.917)"><g class="ico"><path d="M12 21v-8M12 13L5 6M12 13l7-7"/><path d="M5 10V6h4M19 10V6h-4"/></g></g>
  <text x="228" y="62" class="h">Balancer</text>
  <text x="198" y="84" class="s">one strategy per route</text>
  <g class="gray"><text class="cap" x="198" y="112">STATIC</text></g>
  <g class="gray"><rect class="chip" x="198" y="122" width="96" height="20" rx="10"/><text class="chipt" x="246.0" y="136.0">round-robin</text></g>
  <g class="gray"><rect class="chip" x="198" y="148" width="160" height="20" rx="10"/><text class="chipt" x="278.0" y="162.0">weighted-round-robin</text></g>
  <g class="gray"><rect class="chip" x="364" y="148" width="60" height="20" rx="10"/><text class="chipt" x="394.0" y="162.0">random</text></g>
  <g class="blue"><text class="cap" x="198" y="188">LOAD-AWARE</text></g>
  <g class="blue"><rect class="chip" x="198" y="198" width="89" height="20" rx="10"/><text class="chipt" x="242.5" y="212.0">least-conn</text></g>
  <g class="blue"><rect class="chip" x="198" y="224" width="153" height="20" rx="10"/><text class="chipt" x="274.5" y="238.0">least-response-time</text></g>
  <g class="blue"><rect class="chip" x="357" y="224" width="39" height="20" rx="10"/><text class="chipt" x="376.5" y="238.0">p2c</text></g>
  <g class="purple"><text class="cap" x="198" y="264">AFFINITY</text></g>
  <g class="purple"><rect class="chip" x="198" y="274" width="67" height="20" rx="10"/><text class="chipt" x="231.5" y="288.0">ip-hash</text></g>
  <g class="purple"><rect class="chip" x="271" y="274" width="124" height="20" rx="10"/><text class="chipt" x="333.0" y="288.0">consistent-hash</text></g>
  <text x="198" y="338" class="s">Skips every upstream that is unhealthy,</text>
  <text x="198" y="352" class="s">ejected or at its connection cap.</text>
  <g class="blue"><path class="lnA" d="M452 190 H480"/></g>
  <g class="blue"><path class="lnA" d="M480 66 V344"/></g>
  <g class="green"><rect class="zone" x="492" y="20" width="456" height="344" rx="14"/>
  <text class="cap" x="508" y="42">UPSTREAM POOL</text>
  </g>
  <g class="green"><rect class="cardA" x="500" y="54" width="440" height="62" rx="10"/></g>
  <g class="green" transform="translate(514 71) scale(1.083)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text class="b" x="552" y="80">upstream A</text>
  <text x="552" y="100" class="m">gets traffic</text>
  <g class="green"><rect class="chip" x="840" y="66" width="88" height="20" rx="10"/><text class="chipt" x="884.0" y="80.0">healthy</text></g>
  <g class="green"><path class="lnA" d="M480 85 L498 85" marker-end="url(#ar-green)"/></g>
  <g class="green"><rect class="cardA" x="500" y="130" width="440" height="62" rx="10"/></g>
  <g class="green" transform="translate(514 147) scale(1.083)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text class="b" x="552" y="156">upstream B</text>
  <text x="552" y="176" class="m">gets traffic</text>
  <g class="green"><rect class="chip" x="840" y="142" width="88" height="20" rx="10"/><text class="chipt" x="884.0" y="156.0">healthy</text></g>
  <g class="green"><path class="lnA" d="M480 161 L498 161" marker-end="url(#ar-green)"/></g>
  <g class="red"><rect class="cardA" x="500" y="206" width="440" height="62" rx="10"/></g>
  <g class="red" transform="translate(514 223) scale(1.083)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text class="b" x="552" y="232">upstream C</text>
  <text x="552" y="252" class="m">repeated 5xx: skipped, then probed</text>
  <g class="red"><rect class="chip" x="840" y="218" width="88" height="20" rx="10"/><text class="chipt" x="884.0" y="232.0">ejected</text></g>
  <g class="red"><path class="lnA dash" d="M480 237 L498 237" marker-end="url(#ar-red)"/></g>
  <g class="orange"><rect class="cardA" x="500" y="282" width="440" height="62" rx="10"/></g>
  <g class="orange" transform="translate(514 299) scale(1.083)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text class="b" x="552" y="308">upstream D</text>
  <text x="552" y="328" class="m">skipped; 503 if every target is full</text>
  <g class="orange"><rect class="chip" x="840" y="294" width="88" height="20" rx="10"/><text class="chipt" x="884.0" y="308.0">at its cap</text></g>
  <g class="orange"><path class="lnA dash" d="M480 313 L498 313" marker-end="url(#ar-orange)"/></g>
  <g class="orange"><rect class="cardA" x="20" y="262" width="144" height="84" rx="10"/></g>
  <g class="orange" transform="translate(32 274) scale(0.917)"><g class="ico"><path d="M20 11a8 8 0 0 0-14.500-4M4 13a8 8 0 0 0 14.500 4"/><path d="M5.500 3v4h4M18.500 21v-4h-4"/></g></g>
  <text x="62" y="291" class="b">Retry</text>
  <text x="32" y="314" class="s">next target, within</text>
  <text x="32" y="329" class="s">a retry budget</text>
  <g class="orange"><path class="lnA dash" d="M720.0 366 L720.0 384 L92 384 L92 348" marker-end="url(#ar-orange)"/></g>
  <text x="104" y="396" class="s">attempt failed: 5xx, connection error or timeout</text>
  <g class="green">
  <rect class="card" x="20" y="416" width="298.7" height="122" rx="9"/>
  <rect class="acc" x="20" y="426" width="3.4" height="102" rx="1.7"/>
  <g class="None" transform="translate(34 426) scale(0.833)"><g class="ico"><circle cx="12" cy="12" r="9"/><path d="M7.800 12.200l3 3 5.400-6"/></g></g>
  <text class="b" x="62" y="441">Active health checks</text>
  <text class="m" x="34" y="461">a probe path on a timer;</text>
  <text class="m" x="34" y="477">targets that fail leave the</text>
  <text class="m" x="34" y="493">pool and rejoin when healthy</text>
  <text class="m" x="34" y="509">again, with an optional slow start</text>
  </g>
  <g class="red">
  <rect class="card" x="330.7" y="416" width="298.7" height="122" rx="9"/>
  <rect class="acc" x="330.7" y="426" width="3.4" height="102" rx="1.7"/>
  <g class="None" transform="translate(344.7 426) scale(0.833)"><g class="ico"><path d="M2.500 12S6 5.500 12 5.500 21.500 12 21.500 12 18 18.500 12 18.500 2.500 12 2.500 12z"/><circle cx="12" cy="12" r="3"/></g></g>
  <text class="b" x="372.7" y="441">Outlier detection</text>
  <text class="m" x="344.7" y="461">watches real traffic, not probes;</text>
  <text class="m" x="344.7" y="477">ejection time grows on each</text>
  <text class="m" x="344.7" y="493">repeat up to a cap; the first</text>
  <text class="m" x="344.7" y="509">request after it is a probe</text>
  </g>
  <g class="purple">
  <rect class="card" x="641.3" y="416" width="298.7" height="122" rx="9"/>
  <rect class="acc" x="641.3" y="426" width="3.4" height="102" rx="1.7"/>
  <g class="None" transform="translate(655.3 426) scale(0.833)"><g class="ico"><path d="M3 12V4.500A1.500 1.500 0 0 1 4.500 3H12l9 9-9 9z"/><circle cx="8" cy="8" r="1.300" class="icoF"/></g></g>
  <text class="b" x="683.3" y="441">Sticky sessions</text>
  <text class="m" x="655.3" y="461">a session cookie pins a client</text>
  <text class="m" x="655.3" y="477">to one upstream (consistent</text>
  <text class="m" x="655.3" y="493">hash); an optional signed</text>
  <text class="m" x="655.3" y="509">cookie can be set by Conduit</text>
  </g>
</svg>
