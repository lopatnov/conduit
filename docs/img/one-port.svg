<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d">
  <title id="t">One port, three outcomes</title>
  <desc id="d">A three-line configuration: port 8080, static files from ./dist and a proxy route for /api. A request for / is answered with ./dist/index.html, a request for /logo.png with ./dist/logo.png, and a request for /api/users is proxied to http://localhost:4000/api/users.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--blue)"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--green)"/></marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--orange)"/></marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--purple)"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--red)"/></marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--gray)"/></marker>
    <style>
svg { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --faint:#8c959f;
  --blue:#0969da; --blue-s:#ddf4ff; --green:#1a7f37; --green-s:#dafbe1; --orange:#bc4c00; --orange-s:#fff1e5;
  --purple:#8250df; --purple-s:#fbefff; --red:#cf222e; --red-s:#ffebe9; --gray:#59636e; --gray-s:#eaeef2; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --card:#161b22; --line:#3d444d; --text:#f0f6fc; --muted:#9198a1; --faint:#6e7681;
    --blue:#4493f8; --blue-s:#10233f; --green:#3fb950; --green-s:#102a1a; --orange:#e3893b; --orange-s:#33200d;
    --purple:#ab7df8; --purple-s:#241b3d; --red:#f85149; --red-s:#3a1618; --gray:#9198a1; --gray-s:#21262d; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.m { font-size: 12.5px; fill: var(--muted); }
.s { font-size: 11.5px; fill: var(--muted); }
.b { font-size: 14px; font-weight: 600; }
.h { font-size: 15.5px; font-weight: 700; }
.xl { font-size: 22px; font-weight: 700; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ka { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--a); font-weight: 600; }
.acc { fill: var(--a); }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--a); }
.panel { fill: var(--bg); stroke: var(--line); }
.card { fill: var(--card); stroke: var(--line); }
.cardA { fill: var(--card); stroke: var(--a); }
.soft { fill: var(--s); stroke: var(--a); }
.fillS { fill: var(--s); stroke: none; }
.zone { fill: var(--s); stroke: var(--a); stroke-dasharray: none; opacity: 1; }
.zoneD { fill: none; stroke: var(--faint); stroke-dasharray: 5 4; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lnA { fill: none; stroke: var(--a); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 5 4; }
.ico { fill: none; stroke: var(--a); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icoF { fill: var(--a); stroke: var(--a); stroke-width: 1.2; stroke-linejoin: round; }
.num { fill: var(--a); }
.numt { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.chip { fill: var(--s); stroke: var(--a); }
.chipt { font-size: 11.5px; font-weight: 600; fill: var(--a); text-anchor: middle; }
.blue { --a: var(--blue); --s: var(--blue-s); }
.green { --a: var(--green); --s: var(--green-s); }
.orange { --a: var(--orange); --s: var(--orange-s); }
.purple { --a: var(--purple); --s: var(--purple-s); }
.red { --a: var(--red); --s: var(--red-s); }
.gray { --a: var(--gray); --s: var(--gray-s); }
</style>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="959" height="329" rx="16"/>
  <g class="blue"><rect class="cardA" x="24" y="30" width="270" height="270" rx="12"/></g>
  <text x="44" y="60" class="b">conduit.yaml</text>
  <g class="blue"><text class="cap" x="270" y="60" text-anchor="end">YAML</text></g>
  <text x="44" y="106" class="k" style="white-space:pre" xml:space="preserve">port: 8080</text>
  <text x="44" y="134" class="k" style="white-space:pre" xml:space="preserve">static: ./dist</text>
  <text x="44" y="162" class="k" style="white-space:pre" xml:space="preserve">proxy:</text>
  <text x="44" y="190" class="k" style="white-space:pre" xml:space="preserve">  /api: http://localhost:4000</text>
  <text x="44" y="236" class="s">YAML or JSON, same fields.</text>
  <text x="44" y="256" class="s">Start it with:  conduit</text>
  <g class="blue"><path class="lnA" d="M298 165 L352 165" marker-end="url(#ar-blue)"/></g>
  <g class="blue"><rect class="soft" x="354" y="30" width="170" height="270" rx="12"/></g>
  <g class="blue" transform="translate(372 46) scale(0.917)"><g class="ico"><path d="M13 2.500L5 13.500h6l-1 8 8-11h-6z"/></g></g>
  <text x="402" y="64" class="h">Conduit</text>
  <text x="372" y="92" class="m">port 8080</text>
  <g class="blue"><text class="cap" x="372" y="120">ROUTES</text></g>
  <text x="372" y="142" class="k">/api/*   proxy</text>
  <text x="372" y="164" class="k">other    static</text>
  <text x="372" y="214" class="s">Add TLS, auth, rate</text>
  <text x="372" y="230" class="s">limits or a cache in</text>
  <text x="372" y="246" class="s">the same file.</text>
  <g class="blue"><path class="lnA" d="M526 165 H556 M556 72 V260"/></g>
  <g class="green"><path class="lnA" d="M556 72 L586 72" marker-end="url(#ar-green)"/></g>
  <g class="green"><rect class="cardA" x="588" y="36" width="348" height="72" rx="10"/></g>
  <g class="green" transform="translate(604 48) scale(0.917)"><g class="ico"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></g>
  <text class="k" x="636" y="65" style="font-weight:700">GET /</text>
  <text x="636" y="88" class="m">serves ./dist/index.html</text>
  <g class="green"><path class="lnA" d="M556 166 L586 166" marker-end="url(#ar-green)"/></g>
  <g class="green"><rect class="cardA" x="588" y="130" width="348" height="72" rx="10"/></g>
  <g class="green" transform="translate(604 142) scale(0.917)"><g class="ico"><path d="M3 7.5a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></g></g>
  <text class="k" x="636" y="159" style="font-weight:700">GET /logo.png</text>
  <text x="636" y="182" class="m">serves ./dist/logo.png</text>
  <g class="orange"><path class="lnA" d="M556 260 L586 260" marker-end="url(#ar-orange)"/></g>
  <g class="orange"><rect class="cardA" x="588" y="224" width="348" height="72" rx="10"/></g>
  <g class="orange" transform="translate(604 236) scale(0.917)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text class="k" x="636" y="253" style="font-weight:700">GET /api/users</text>
  <text x="636" y="276" class="m">proxied to http://localhost:4000/api/users</text>
</svg>
