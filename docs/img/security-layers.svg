<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img" aria-labelledby="t d">
  <title id="t">Security in layers</title>
  <desc id="d">Four layers protect your services. Network: IP allow and deny lists, TLS with optional mTLS client certificates and allowed hosts. Abuse control: request limits, rate limits per client, key, route or consumer, and priority load shedding. Identity: named consumers, Basic auth, API keys, JWT checked against a JWKS URL or a shared secret, and forward auth to your own service. Hardening: security headers, CORS, header sanitising and 5xx body masking.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--blue)"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--green)"/></marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--orange)"/></marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--purple)"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--red)"/></marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--gray)"/></marker>
    <style>
svg { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --faint:#8c959f;
  --blue:#0969da; --blue-s:#ddf4ff; --green:#1a7f37; --green-s:#dafbe1; --orange:#bc4c00; --orange-s:#fff1e5;
  --purple:#8250df; --purple-s:#fbefff; --red:#cf222e; --red-s:#ffebe9; --gray:#59636e; --gray-s:#eaeef2; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --card:#161b22; --line:#3d444d; --text:#f0f6fc; --muted:#9198a1; --faint:#6e7681;
    --blue:#4493f8; --blue-s:#10233f; --green:#3fb950; --green-s:#102a1a; --orange:#e3893b; --orange-s:#33200d;
    --purple:#ab7df8; --purple-s:#241b3d; --red:#f85149; --red-s:#3a1618; --gray:#9198a1; --gray-s:#21262d; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.m { font-size: 12.5px; fill: var(--muted); }
.s { font-size: 11.5px; fill: var(--muted); }
.b { font-size: 14px; font-weight: 600; }
.h { font-size: 15.5px; font-weight: 700; }
.xl { font-size: 22px; font-weight: 700; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ka { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--a); font-weight: 600; }
.acc { fill: var(--a); }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--a); }
.panel { fill: var(--bg); stroke: var(--line); }
.card { fill: var(--card); stroke: var(--line); }
.cardA { fill: var(--card); stroke: var(--a); }
.soft { fill: var(--s); stroke: var(--a); }
.fillS { fill: var(--s); stroke: none; }
.zone { fill: var(--s); stroke: var(--a); stroke-dasharray: none; opacity: 1; }
.zoneD { fill: none; stroke: var(--faint); stroke-dasharray: 5 4; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lnA { fill: none; stroke: var(--a); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 5 4; }
.ico { fill: none; stroke: var(--a); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icoF { fill: var(--a); stroke: var(--a); stroke-width: 1.2; stroke-linejoin: round; }
.num { fill: var(--a); }
.numt { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.chip { fill: var(--s); stroke: var(--a); }
.chipt { font-size: 11.5px; font-weight: 600; fill: var(--a); text-anchor: middle; }
.blue { --a: var(--blue); --s: var(--blue-s); }
.green { --a: var(--green); --s: var(--green-s); }
.orange { --a: var(--orange); --s: var(--orange-s); }
.purple { --a: var(--purple); --s: var(--purple-s); }
.red { --a: var(--red); --s: var(--red-s); }
.gray { --a: var(--gray); --s: var(--gray-s); }
</style>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="959" height="391" rx="16"/>
  <g class="blue"><rect class="card" x="20.0" y="20" width="219.5" height="276" rx="12" style="stroke:var(--a)"/>
  <path class="fillS" d="M20.8 70 V32 a12 12 0 0 1 12 -12 H226.7 a12 12 0 0 1 12 12 V70 Z"/>
  <path d="M21.0 70 H238.5" style="stroke:var(--a);stroke-width:1;fill:none;opacity:.5"/></g>
  <g class="blue" transform="translate(36.0 33) scale(1.000)"><g class="ico"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 3 15 0 18c-3-3-3-15 0-18z"/></g></g>
  <text class="h" x="70.0" y="52">Network</text>
  <text class="b" x="36.0" y="96">IP allow / deny</text>
  <text class="s" x="36.0" y="112">CIDR lists; runs before auth</text>
  <text class="b" x="36.0" y="141">TLS and mTLS</text>
  <text class="s" x="36.0" y="157">your certificates or ACME;</text>
  <text class="s" x="36.0" y="172">client certificates optional</text>
  <text class="b" x="36.0" y="201">Allowed hosts</text>
  <text class="s" x="36.0" y="217">unknown Host headers get 400</text>
  <g class="orange"><rect class="card" x="253.5" y="20" width="219.5" height="276" rx="12" style="stroke:var(--a)"/>
  <path class="fillS" d="M254.3 70 V32 a12 12 0 0 1 12 -12 H460.2 a12 12 0 0 1 12 12 V70 Z"/>
  <path d="M254.5 70 H472.0" style="stroke:var(--a);stroke-width:1;fill:none;opacity:.5"/></g>
  <g class="orange" transform="translate(269.5 33) scale(1.000)"><g class="ico"><path d="M4.500 17a8.500 8.500 0 1 1 15 0"/><path d="M12 13.500l4-4.500"/><circle cx="12" cy="14" r="1.2" class="icoF"/></g></g>
  <text class="h" x="303.5" y="52">Abuse control</text>
  <text class="b" x="269.5" y="96">Request limits</text>
  <text class="s" x="269.5" y="112">body, header and time limits</text>
  <text class="b" x="269.5" y="141">Rate limits</text>
  <text class="s" x="269.5" y="157">per IP, header, route, consumer</text>
  <text class="b" x="269.5" y="186">Load shedding</text>
  <text class="s" x="269.5" y="202">low-priority routes first</text>
  <text class="b" x="269.5" y="231">Redis (optional)</text>
  <text class="s" x="269.5" y="247">limits shared by instances</text>
  <g class="red"><rect class="card" x="487.0" y="20" width="219.5" height="276" rx="12" style="stroke:var(--a)"/>
  <path class="fillS" d="M487.8 70 V32 a12 12 0 0 1 12 -12 H693.7 a12 12 0 0 1 12 12 V70 Z"/>
  <path d="M488.0 70 H705.5" style="stroke:var(--a);stroke-width:1;fill:none;opacity:.5"/></g>
  <g class="red" transform="translate(503.0 33) scale(1.000)"><g class="ico"><circle cx="8" cy="12" r="3.8"/><path d="M11.800 12H21M17 12v3M20 12v2.200"/></g></g>
  <text class="h" x="537.0" y="52">Identity</text>
  <text class="b" x="503.0" y="96">Consumers</text>
  <text class="s" x="503.0" y="112">named clients, own keys, quotas</text>
  <text class="b" x="503.0" y="141">Basic and API key</text>
  <text class="s" x="503.0" y="157">secrets can come from env vars</text>
  <text class="b" x="503.0" y="186">JWT</text>
  <text class="s" x="503.0" y="202">JWKS URL or shared secret;</text>
  <text class="s" x="503.0" y="217">claims reach upstream headers</text>
  <text class="b" x="503.0" y="246">Forward auth</text>
  <text class="s" x="503.0" y="262">your service decides</text>
  <g class="purple"><rect class="card" x="720.5" y="20" width="219.5" height="276" rx="12" style="stroke:var(--a)"/>
  <path class="fillS" d="M721.3 70 V32 a12 12 0 0 1 12 -12 H927.2 a12 12 0 0 1 12 12 V70 Z"/>
  <path d="M721.5 70 H939.0" style="stroke:var(--a);stroke-width:1;fill:none;opacity:.5"/></g>
  <g class="purple" transform="translate(736.5 33) scale(1.000)"><g class="ico"><path d="M12 3l7.5 3v5.5c0 4.6-3.2 7.7-7.5 9.5C7.700 19.200 4.500 16.100 4.500 11.500V6z"/><path d="M8.800 12l2.200 2.200 4.200-4.400"/></g></g>
  <text class="h" x="770.5" y="52">Hardening</text>
  <text class="b" x="736.5" y="96">Security headers</text>
  <text class="s" x="736.5" y="112">safe defaults, one switch;</text>
  <text class="s" x="736.5" y="127">HSTS is optional</text>
  <text class="b" x="736.5" y="156">CORS</text>
  <text class="s" x="736.5" y="172">preflight answered by Conduit</text>
  <text class="b" x="736.5" y="201">Header hygiene</text>
  <text class="s" x="736.5" y="217">CR / LF stripped from upstream</text>
  <text class="b" x="736.5" y="246">Error masking</text>
  <text class="s" x="736.5" y="262">5xx bodies replaced by a</text>
  <text class="s" x="736.5" y="277">generic JSON error</text>
  <g class="gray"><rect class="soft" x="20" y="312" width="920" height="48" rx="10"/></g>
  <g class="gray" transform="translate(36 324) scale(1.000)"><g class="ico"><path d="M12 3L2.500 8 12 13 21.500 8z"/><path d="M2.500 12.500L12 17.500l9.500-5M2.500 16.500L12 21.500l9.500-5"/></g></g>
  <text x="72" y="333" class="b">Checks run in a fixed order, and the first one that says no ends the request.</text>
  <text x="72" y="350" class="s">A blocked client never reaches rate limiting or auth; a failed login never reaches your scripts or your upstream.</text>
</svg>
