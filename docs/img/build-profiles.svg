<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d">
  <title id="t">Choose your build</title>
  <desc id="d">Four build layers, each including the ones below it. Always on: routing, TLS, filters, basic auth, metrics and the Admin API. Default adds reverse proxy, static files, compression and browser live reload. Standard adds JWT, consumers, forward auth, caching and ACME. Full adds scripting, WebAssembly, TCP proxy, upload, Redis, disk cache, fault injection, OpenTelemetry and Kubernetes. npm installs full, release archives and Docker offer standard and full, and cargo install builds the default or any feature set you name.</desc>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--muted)"/></marker>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--blue)"/></marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--green)"/></marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--orange)"/></marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--purple)"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--red)"/></marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--gray)"/></marker>
    <style>
svg { --bg:#f6f8fa; --card:#ffffff; --line:#d0d7de; --text:#1f2328; --muted:#59636e; --faint:#8c959f;
  --blue:#0969da; --blue-s:#ddf4ff; --green:#1a7f37; --green-s:#dafbe1; --orange:#bc4c00; --orange-s:#fff1e5;
  --purple:#8250df; --purple-s:#fbefff; --red:#cf222e; --red-s:#ffebe9; --gray:#59636e; --gray-s:#eaeef2; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#0d1117; --card:#161b22; --line:#3d444d; --text:#f0f6fc; --muted:#9198a1; --faint:#6e7681;
    --blue:#4493f8; --blue-s:#10233f; --green:#3fb950; --green-s:#102a1a; --orange:#e3893b; --orange-s:#33200d;
    --purple:#ab7df8; --purple-s:#241b3d; --red:#f85149; --red-s:#3a1618; --gray:#9198a1; --gray-s:#21262d; }
}
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
.m { font-size: 12.5px; fill: var(--muted); }
.s { font-size: 11.5px; fill: var(--muted); }
.b { font-size: 14px; font-weight: 600; }
.h { font-size: 15.5px; font-weight: 700; }
.xl { font-size: 22px; font-weight: 700; }
.k { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
.ka { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--a); font-weight: 600; }
.acc { fill: var(--a); }
.cap { font-size: 11px; font-weight: 700; letter-spacing: .06em; fill: var(--a); }
.panel { fill: var(--bg); stroke: var(--line); }
.card { fill: var(--card); stroke: var(--line); }
.cardA { fill: var(--card); stroke: var(--a); }
.soft { fill: var(--s); stroke: var(--a); }
.fillS { fill: var(--s); stroke: none; }
.zone { fill: var(--s); stroke: var(--a); stroke-dasharray: none; opacity: 1; }
.zoneD { fill: none; stroke: var(--faint); stroke-dasharray: 5 4; }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.lnA { fill: none; stroke: var(--a); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.dash { stroke-dasharray: 5 4; }
.ico { fill: none; stroke: var(--a); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icoF { fill: var(--a); stroke: var(--a); stroke-width: 1.2; stroke-linejoin: round; }
.num { fill: var(--a); }
.numt { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
.chip { fill: var(--s); stroke: var(--a); }
.chipt { font-size: 11.5px; font-weight: 600; fill: var(--a); text-anchor: middle; }
.blue { --a: var(--blue); --s: var(--blue-s); }
.green { --a: var(--green); --s: var(--green-s); }
.orange { --a: var(--orange); --s: var(--orange-s); }
.purple { --a: var(--purple); --s: var(--purple-s); }
.red { --a: var(--red); --s: var(--red-s); }
.gray { --a: var(--gray); --s: var(--gray-s); }
</style>
  </defs>
  <rect class="panel" x="0.5" y="0.5" width="959" height="469" rx="16"/>
  <g class="purple"><rect class="soft" x="64" y="20" width="516" height="96" rx="12"/></g>
  <g class="purple"><rect class="acc" x="64" y="32" width="4" height="72" rx="2"/></g>
  <text x="86" y="52" class="h">Full</text>
  <g class="purple"><text class="cap" x="562" y="50" text-anchor="end">ADDS</text></g>
  <text x="86" y="76" class="m">Rhai scripts, WebAssembly plugins, TCP proxy, file upload, Redis,</text>
  <text x="86" y="93" class="m">disk cache, fault injection, OpenTelemetry, Kubernetes provider</text>
  <g class="orange"><rect class="soft" x="64" y="128" width="516" height="96" rx="12"/></g>
  <g class="orange"><rect class="acc" x="64" y="140" width="4" height="72" rx="2"/></g>
  <text x="86" y="160" class="h">Standard</text>
  <g class="orange"><text class="cap" x="562" y="158" text-anchor="end">ADDS</text></g>
  <text x="86" y="184" class="m">JWT, consumers, forward auth, response caching, automatic</text>
  <text x="86" y="201" class="m">certificates (ACME)</text>
  <g class="green"><rect class="soft" x="64" y="236" width="516" height="96" rx="12"/></g>
  <g class="green"><rect class="acc" x="64" y="248" width="4" height="72" rx="2"/></g>
  <text x="86" y="268" class="h">Default</text>
  <g class="green"><text class="cap" x="562" y="266" text-anchor="end">ADDS</text></g>
  <text x="86" y="292" class="m">reverse proxy, static files, compression, browser live reload</text>
  <g class="blue"><rect class="soft" x="64" y="344" width="516" height="96" rx="12"/></g>
  <g class="blue"><rect class="acc" x="64" y="356" width="4" height="72" rx="2"/></g>
  <text x="86" y="376" class="h">Always on</text>
  <g class="blue"><text class="cap" x="562" y="374" text-anchor="end">THE BASE</text></g>
  <text x="86" y="400" class="m">routing, TLS, guards and filters, Basic auth, metrics, Admin API</text>
  <g class="gray"><path class="ln" d="M36 412 V40" marker-end="url(#ar-gray)"/></g>
  <g class="gray"><text class="cap" transform="translate(30 226) rotate(-90)" text-anchor="middle">EACH LAYER INCLUDES THE ONES BELOW IT</text></g>
  <g class="gray"><rect class="zone" x="604" y="20" width="336" height="438" rx="14"/>
  <text class="cap" x="620" y="42">WHERE YOU GET EACH BUILD</text>
  </g>
  <g class="purple"><rect class="cardA" x="620" y="56" width="304" height="78" rx="10"/></g>
  <g class="purple" transform="translate(634 70) scale(0.917)"><g class="ico"><rect x="3" y="4.500" width="18" height="15" rx="2.500"/><path d="M7.500 10l3 2.500-3 2.500M13 15h4"/></g></g>
  <text x="666" y="86" class="b">npx or npm install -g</text>
  <text x="666" y="106" class="m">full</text>
  <g class="orange"><rect class="cardA" x="620" y="148" width="304" height="78" rx="10"/></g>
  <g class="orange" transform="translate(634 162) scale(0.917)"><g class="ico"><path d="M12 3l8.500 4.500v9L12 21l-8.500-4.500v-9z"/><path d="M3.500 7.500L12 12l8.500-4.500M12 12v9"/></g></g>
  <text x="666" y="178" class="b">GitHub release archives</text>
  <text x="666" y="198" class="m">standard or full</text>
  <g class="orange"><rect class="cardA" x="620" y="240" width="304" height="78" rx="10"/></g>
  <g class="orange" transform="translate(634 254) scale(0.917)"><g class="ico"><rect x="3" y="4" width="18" height="6.5" rx="1.8"/><rect x="3" y="13.5" width="18" height="6.5" rx="1.8"/><circle cx="7" cy="7.25" r=".9" class="icoF"/><circle cx="7" cy="16.75" r=".9" class="icoF"/></g></g>
  <text x="666" y="270" class="b">Docker image</text>
  <text x="666" y="290" class="m">:latest is standard,</text>
  <text x="666" y="305" class="m">:latest-full is full</text>
  <g class="green"><rect class="cardA" x="620" y="332" width="304" height="78" rx="10"/></g>
  <g class="green" transform="translate(634 346) scale(0.917)"><g class="ico"><path d="M8.500 7L3.500 12l5 5M15.500 7l5 5-5 5M13.500 5l-3 14"/></g></g>
  <text x="666" y="362" class="b">cargo install</text>
  <text x="666" y="382" class="m">default, plus --features you name</text>
  <g class="gray"><text class="s" x="620" y="424">conduit features -c conduit.yaml</text><text class="s" x="620" y="439">tells you which features a config needs.</text></g>
</svg>
