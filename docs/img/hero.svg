<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" role="img" aria-labelledby="t d">
  <title id="t">Where Conduit sits</title>
  <desc id="d">Clients connect to Conduit over HTTP/1.1, HTTP/2, WebSocket or raw TCP. Inside one Conduit process, listeners hand each request to an ordered chain of guards and a router, which picks a handler: reverse proxy, TCP proxy, static files or upload. The proxy handlers forward to your services and the file handlers use files on disk. Redis and an identity provider are optional. Logs, Prometheus metrics, OpenTelemetry traces, the Admin API and hot reload sit alongside the request path.</desc>
