# Cross-compilation configuration for `cross`.
# See https://github.com/cross-rs/cross/wiki/Configuration

[target.riscv64gc-unknown-linux-gnu]
# The default cross image for riscv64 does not include cmake, which is
# required by libz-ng-sys (a transitive dep from async-compression).
# We install cmake and write a cmake toolchain file so cmake can build
# C libraries targeting riscv64 using the cross-compiler in the image.
pre-build = [
    "apt-get update -q",
    "apt-get install -y --no-install-recommends cmake",
    # Create a cmake toolchain file that points at the riscv64 cross-compiler.
    # The cmake crate reads CMAKE_TOOLCHAIN_FILE_riscv64gc_unknown_linux_gnu.
    "printf 'set(CMAKE_SYSTEM_NAME Linux)\\nset(CMAKE_SYSTEM_PROCESSOR riscv64)\\nset(CMAKE_C_COMPILER riscv64-linux-gnu-gcc)\\nset(CMAKE_CXX_COMPILER riscv64-linux-gnu-g++)\\nset(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)\\nset(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)\\nset(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)\\n' > /riscv64-toolchain.cmake",
]

[target.riscv64gc-unknown-linux-gnu.env]
set = { "CMAKE_TOOLCHAIN_FILE_riscv64gc_unknown_linux_gnu" = "/riscv64-toolchain.cmake" }
