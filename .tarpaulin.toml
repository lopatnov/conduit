[run]
# Exclude files that require a live Pingora session, Axum state, or a running
# server — these are covered by integration tests (cargo test), not by the
# unit-test pass that tarpaulin --lib measures.
exclude_files = [
    "src/main.rs",
    "src/lib.rs",
    "src/cli/*",
    "src/server/*",
    "src/upload/*",
    "src/admin/api.rs",
    "src/proxy/service.rs",
    "src/handler/response.rs",
    "src/handler/static_files.rs",
    "src/handler/fallback.rs",
    "src/handler/metrics.rs",
    "src/handler/hot_reload.rs",
    "src/util/log_writer.rs",
]
