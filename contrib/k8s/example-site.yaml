# Example ConduitSite resources and Conduit Deployment
#
# Usage:
#   kubectl apply -f contrib/k8s/conduitsite-crd.yaml
#   kubectl apply -f contrib/k8s/example-site.yaml
#
# The Conduit pod watches all ConduitSite resources in its namespace and
# automatically reconfigures itself when they change.

---
# SPA with API proxy
apiVersion: conduit.io/v1
kind: ConduitSite
metadata:
  name: my-app
  namespace: default
spec:
  port: 8080
  host: app.example.com
  proxy:
    /api:
      targets:
        - http://api-svc:4000
      strategy: least-conn
      stripPrefix: true
      healthCheck:
        path: /health
        intervalSecs: 10
  healthCheck: true
  compression: true
  logging: json
  fallback:
    byAccept:
      html:
        status: 404
        body: "<h1>Not Found</h1>"
      json:
        status: 404
        body:
          error: Not Found

---
# Admin panel behind an IP allow-list (a ConduitSite is stored as written: `$VAR` is not expanded,
# so keep credentials out of it; see docs/kubernetes.md)
apiVersion: conduit.io/v1
kind: ConduitSite
metadata:
  name: admin-panel
  namespace: default
spec:
  port: 8080
  host: admin.example.com
  proxy: http://admin-svc:5000
  ipFilter:
    allow:
      - 10.0.0.0/8

---
# Conduit Deployment (requires kubernetes feature)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conduit
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: conduit
  template:
    metadata:
      labels:
        app: conduit
    spec:
      serviceAccountName: conduit
      containers:
        - name: conduit
          image: ghcr.io/lopatnov/conduit:latest  # kubernetes feature requires the full image (the plain tag)
          args:
            - --kubernetes-namespace=default   # watch this namespace for ConduitSite CRDs
          securityContext:
            runAsNonRoot: true          # conduit image runs as UID 65534 (nobody)
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /__health__
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /__health__
              port: http
            initialDelaySeconds: 3

---
# ServiceAccount + RBAC for watching CRDs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: conduit
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: conduit-crd-reader
  namespace: default
rules:
  - apiGroups: [conduit.io]
    resources: [conduitsites]
    verbs: [get, list, watch]
  - apiGroups: [conduit.io]
    resources: [conduitsites/status]
    verbs: [patch]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: conduit-crd-reader
  namespace: default
subjects:
  - kind: ServiceAccount
    name: conduit
    namespace: default
roleRef:
  kind: Role
  name: conduit-crd-reader
  apiGroup: rbac.authorization.k8s.io
