[package]
name        = "lopatnov-conduit"
version     = "0.0.1"
edition     = "2021"
description = "High-performance reverse proxy and file server built on Cloudflare Pingora"
license     = "Apache-2.0"
repository  = "https://github.com/lopatnov/conduit"
keywords    = ["proxy", "reverse-proxy", "http", "server", "pingora"]
categories  = ["network-programming", "web-programming::http-server"]

[[bin]]
name = "conduit"
path = "src/main.rs"

[lib]
name = "conduit"
path = "src/lib.rs"

[dependencies]
# --- Pingora core ---
pingora                = { version = "0.8", features = ["rustls"] }
pingora-core           = { version = "0.8", features = ["rustls"] }
pingora-proxy          = { version = "0.8", features = ["rustls"] }
pingora-load-balancing = { version = "0.8", features = ["rustls"] }
pingora-cache          = { version = "0.8", features = ["rustls"] }

# --- Config & parsing ---
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
serde_path_to_error = "0.1"
indexmap            = { version = "2", features = ["serde"] }
humantime           = "2"

# --- CLI ---
clap        = { version = "4", features = ["derive", "env"] }
dialoguer   = "0.11"
indicatif   = "0.17"
async-trait = "0.1"

# --- Pingora HTTP types ---
pingora-http = "0.8"

# --- Async runtime & HTTP ---
tokio = { version = "1", features = ["full"] }
axum  = "0.8"

# --- Compression ---
async-compression = { version = "0.4", features = ["gzip", "brotli", "deflate", "futures-io"] }

# --- Observability ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus         = "0.13"

# --- Performance & state ---
arc-swap = "1"
dashmap  = "6"  # v7 is RC as of 2026-05 — upgrade after stable release

# --- Functionality ---
mime_guess = "2"
notify     = "7"
regex      = "1"
multer     = "3"
uuid       = { version = "1", features = ["v4"] }

# --- TLS ---
instant-acme = "0.7"
rcgen        = "0.13"
# ring is the crypto provider for rustls; needed to install before TLS starts.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# --- Errors & utilities ---
anyhow    = "1"
thiserror = "2"
bytes     = "1"
httpdate  = "1"
http      = "1"

# Phase 4: Rhai scripting middleware
# rhai = "1"

[dev-dependencies]
reqwest     = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "blocking", "json"] }
criterion   = { version = "0.5", features = ["html_reports"] }
tempfile    = "3"
serial_test = "3"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
