[package]
name        = "lopatnov-conduit"
version     = "1.0.0"
edition     = "2021"
description = "High-performance reverse proxy and file server built on Cloudflare Pingora"
license     = "Apache-2.0"
repository  = "https://github.com/lopatnov/conduit"
keywords    = ["proxy", "reverse-proxy", "http", "server", "pingora"]
categories  = ["network-programming", "web-programming::http-server"]

[[bin]]
name = "conduit"
path = "src/main.rs"

[lib]
name = "conduit"
path = "src/lib.rs"

[dependencies]
# --- Pingora core ---
pingora                = { version = "0.8", features = ["rustls"] }
pingora-core           = { version = "0.8", features = ["rustls"] }
pingora-proxy          = { version = "0.8", features = ["rustls"] }
pingora-load-balancing = { version = "0.8", features = ["rustls"] }
pingora-cache          = { version = "0.8", features = ["rustls"] }

# --- Config & parsing ---
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
serde_yaml          = "0.9"
serde_path_to_error = "0.1"
indexmap            = { version = "2", features = ["serde"] }
humantime           = "2"

# --- CLI ---
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen   = "0.3"
dialoguer     = "0.12"
indicatif     = "0.18"
async-trait   = "0.1"

# --- Pingora HTTP types ---
pingora-http = "0.8"

# --- Async runtime & HTTP ---
tokio = { version = "1", features = ["full"] }
axum  = { version = "0.8", features = ["multipart"] }

# --- Compression ---
async-compression = { version = "0.4", features = ["gzip", "brotli", "deflate", "zstd", "tokio"] }

# --- Observability ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus         = "0.14"

# --- Performance & state ---
arc-swap = "1"
dashmap  = "6"  # v7 is RC as of 2026-05 — upgrade after stable release

# --- Functionality ---
mime_guess = "2"
notify     = "8"
regex      = "1"
multer     = "3"
uuid       = { version = "1", features = ["v4"] }

# --- TLS / ACME ---
instant-acme = { version = "0.8", features = ["rcgen"] }
rcgen        = "0.14"
x509-parser  = "0.17"
# ring is the crypto provider for rustls; needed to install before TLS starts.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# --- Errors & utilities ---
anyhow    = "1"
thiserror = "2"
bytes     = "1"
httpdate  = "1"
http      = "1"
base64    = "0.22"

# Phase 4: Rhai scripting middleware
rhai = { version = "1", features = ["sync"] }

# JWT bearer-token validation (Phase 4.3).
# `jsonwebtoken` verifies HS256 (HMAC secret) and RS256/ES256 (JWKS/PEM).
jsonwebtoken = "9"

# HTTP client used for JWKS endpoint fetching and traffic mirroring.
# `default-features = false` avoids native-tls; rustls keeps TLS consistent.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# Phase 4.2: Redis-backed rate limiting.
# tls-rustls enables rediss:// (TLS-encrypted) connections (e.g. AWS ElastiCache,
# Azure Cache for Redis).  Redis is often on an internal network but cloud
# deployments frequently require in-transit encryption.
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp"] }

# --- Kubernetes provider (optional feature) ---
# Enable with: cargo build --features kubernetes
kube        = { version = "0.99", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.24", optional = true }
schemars    = { version = "0.8", optional = true }
futures     = { version = "0.3", optional = true }

# --- WASM plugin middleware (optional feature) ---
# Enable with: cargo build --features wasm
# Cranelift JIT: fast compilation; no WASI by default (sandboxed).
wasmtime = { version = "45", features = ["cranelift"], optional = true }

# --- OpenTelemetry OTLP tracing (optional feature) ---
# Enable with: cargo build --features otlp
# Exports distributed traces to any OTLP-compatible backend:
# Grafana Tempo, Jaeger, Honeycomb, OpenTelemetry Collector, etc.
# Uses gRPC (tonic) transport; adds ~4 MB to binary.
opentelemetry     = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"], optional = true }

[features]
# Enable Kubernetes CRD watching support.
# The v1_30 feature selects the minimum k8s API version (1.30).
kubernetes = ["kube", "k8s-openapi/v1_30", "schemars", "futures"]
# Enable WASM plugin middleware (type: "wasm" in middleware array).
wasm = ["wasmtime"]
# Enable OpenTelemetry OTLP distributed tracing.
# Config: global.otlp.endpoint = "http://otel-collector:4317"
otlp = ["opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp"]

[dev-dependencies]
reqwest     = { version = "0.13", default-features = false, features = ["http2", "rustls", "blocking", "json", "multipart"] }
criterion   = { version = "0.8", features = ["html_reports"] }
tempfile    = "3"
serial_test = "3"
time        = { version = "0.3", features = ["std"] }
# wat: parse WebAssembly Text Format in tests (compile inline WAT → wasm bytes)
wat         = "1"

[profile.release]
lto           = true
codegen-units = 1
strip         = true
