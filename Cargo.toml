# Conduit 2.0 workspace root — see issue #114. crates/conduit-core (#126) is
# the first member; more land here as later phases extract them.
[workspace]
members  = ["crates/*"]
resolver = "2"

[workspace.package]
version    = "2.0.0"
edition    = "2021"
license    = "Apache-2.0"
repository = "https://github.com/lopatnov/conduit"

# Every third-party dependency lives here (Phase 0.2, issue #116) so future
# member crates under crates/* inherit identical versions/features for
# shared deps via `dep.workspace = true` — the primary defense against Cargo
# feature unification silently pulling in mismatched feature sets later.
[workspace.dependencies]
# --- Pingora core ---
# pingora and pingora-load-balancing dropped (#117, integrity audit): declared
# but zero references anywhere in src/ — pingora-core/-proxy/-cache cover
# everything actually used.
pingora-core  = { version = "0.8", features = ["rustls"] }
pingora-proxy = { version = "0.8", features = ["rustls"] }
pingora-cache = { version = "0.8", features = ["rustls"] }

# --- Conduit workspace member crates ---
# path + version so `cargo publish` can resolve this as a real dependency
# once member crates start publishing (see #114's crates.io-publishing risk).
lopatnov-conduit-core        = { path = "crates/conduit-core", version = "2.0.0" }
lopatnov-conduit-config-core = { path = "crates/conduit-config-core", version = "2.0.0" }
lopatnov-conduit-otlp        = { path = "crates/conduit-otlp", version = "2.0.0" }
lopatnov-conduit-acme        = { path = "crates/conduit-acme", version = "2.0.0" }
lopatnov-conduit-tcp         = { path = "crates/conduit-tcp", version = "2.0.0" }
lopatnov-conduit-upload      = { path = "crates/conduit-upload", version = "2.0.0" }
lopatnov-conduit-faults      = { path = "crates/conduit-faults", version = "2.0.0" }
lopatnov-conduit-auth-jwt    = { path = "crates/conduit-auth-jwt", version = "2.0.0" }
lopatnov-conduit-auth-forward   = { path = "crates/conduit-auth-forward", version = "2.0.0" }
lopatnov-conduit-auth-consumers = { path = "crates/conduit-auth-consumers", version = "2.0.0" }
lopatnov-conduit-cache          = { path = "crates/conduit-cache", version = "2.0.0" }
lopatnov-conduit-ipfilter          = { path = "crates/conduit-ipfilter", version = "2.0.0" }
lopatnov-conduit-cors              = { path = "crates/conduit-cors", version = "2.0.0" }
lopatnov-conduit-security-headers  = { path = "crates/conduit-security-headers", version = "2.0.0" }
lopatnov-conduit-ratelimit         = { path = "crates/conduit-ratelimit", version = "2.0.0" }
lopatnov-conduit-limits             = { path = "crates/conduit-limits", version = "2.0.0" }
lopatnov-conduit-compression        = { path = "crates/conduit-compression", version = "2.0.0" }
lopatnov-conduit-static              = { path = "crates/conduit-static", version = "2.0.0" }
lopatnov-conduit-hotreload           = { path = "crates/conduit-hotreload", version = "2.0.0" }
lopatnov-conduit-metrics             = { path = "crates/conduit-metrics", version = "2.0.0" }
lopatnov-conduit-redirects           = { path = "crates/conduit-redirects", version = "2.0.0" }

# --- Config & parsing ---
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
serde_yaml          = "0.9"
serde_path_to_error = "0.1"
indexmap            = { version = "2", features = ["serde"] }
# humantime: only used by crates/conduit-static's `max_age` duration parsing
# (gated behind that crate's own `static` feature) as of #114/#139 — no
# longer a direct root-crate dependency, but kept as a shared workspace
# entry since that crate still needs it via `.workspace = true`.
humantime           = "2"

# --- CLI ---
clap          = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen   = "0.3"
dialoguer     = "0.12"
indicatif     = "0.18"
async-trait   = "0.1"

# --- Pingora HTTP types ---
pingora-http = "0.8"

# --- Async runtime & HTTP ---
tokio = { version = "1", features = ["full"] }
axum  = { version = "0.8" }

# --- Compression ---
async-compression = { version = "0.4", features = ["gzip", "brotli", "deflate", "zstd", "tokio"] }

# --- Observability ---
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus         = "0.14"

# --- Performance & state ---
arc-swap = "1"
dashmap  = "6"  # v7 is RC as of 2026-05 — upgrade after stable release

# --- Functionality ---
# mime_guess: content-type detection. Not a direct root-crate dependency —
# only crates/conduit-static (own `static` feature) and crates/conduit-upload
# (own `upload` feature) use it, both gated. Kept as a shared workspace entry.
mime_guess = "2"
notify     = "8"
regex      = "1"
uuid       = { version = "1", features = ["v4"] }

# --- TLS (always needed) ---
x509-parser = "0.18"

# --- ACME / auto-TLS (crates/conduit-acme, its own `acme` feature) ---
# instant-acme is only ever used by crates/conduit-acme. rcgen is used both
# there (via instant-acme's "rcgen" feature) and unconditionally by the root
# crate's dev-dependencies (test cert generation) — kept as a shared
# workspace dependency for that reason.
instant-acme = { version = "0.8", features = ["rcgen"] }
rcgen        = "0.14"
# ring is the crypto provider for rustls; needed to install before TLS starts.
rustls         = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"

# --- Errors & utilities ---
anyhow    = "1"
thiserror = "2"
bytes     = "1"
subtle    = "2"   # constant-time comparisons (admin token auth)
libc      = "0.2" # O_NOFOLLOW for atomic symlink-safe file open (Unix) — crates/conduit-core, crates/conduit-acme, crates/conduit-static
url       = "2"   # URL parsing for proxy-loop and SSRF detection
httpdate  = "1"
http      = "1"
base64    = "0.23"
hmac      = "0.13"
sha2      = "0.11"

# --- Rhai scripting middleware (feature: rhai) ---
rhai = { version = "1", features = ["sync"] }

# --- JWT bearer-token authentication (crates/conduit-auth-jwt, its own
# `jwt` feature, forwarded from the root crate's `jwt` feature — #114/#133)
# ---
# Verifies HS256 (HMAC secret) and RS256/ES256 (JWKS/PEM). Also used by the
# root crate's own [dev-dependencies] (tests/auth.rs generates test tokens).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }

# --- Test-only: generate throwaway RSA-2048 / P-256 keypairs at test-run
# time for JWKS/RS256/ES256 coverage (issue #164), instead of embedding
# static PEM literals — matches the `rcgen` "no checked-in cert fixtures"
# idiom above and avoids tripping secret-scanners on fake-but-key-shaped
# source text. Same versions already resolved transitively via
# jsonwebtoken's rust_crypto backend, so this adds no new entries to the
# dependency graph — just a direct dev-dep edge to what was already there.
# Referenced from crates/conduit-auth-jwt's [dev-dependencies] and the root
# crate's own [dev-dependencies] below (tests/auth.rs).
# Uses `rand_core::OsRng` (0.6), not the `rand` crate: `rsa`/`p256` (via
# `elliptic-curve`) require the `rand_core` 0.6 `CryptoRngCore` trait, which
# `rand` 0.9's `ThreadRng` (built on `rand_core` 0.9) no longer implements —
# confirmed a real, non-transient E0277 trait-mismatch build break when
# Dependabot proposed the 0.8→0.9 bump (PR #272, root-caused on `main` via
# PR #294). `rand` itself is not used anywhere in this workspace, so
# depending on `rand_core` directly avoids the mismatch entirely rather than
# pinning `rand` and waiting on rsa/p256 to catch up.
rsa       = "0.9"
p256      = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }

# --- HTTP client (feature: jwt for JWKS via crates/conduit-auth-jwt,
# forward-auth, mirroring) ---
# `default-features = false` avoids native-tls; rustls keeps TLS consistent.
# Base feature set covers main-crate usage (ForwardAuth/mirroring) and
# crates/conduit-auth-jwt's JWKS fetch; the dev-dependency below adds
# test-only extras (http2/blocking/multipart) on top via feature union,
# since workspace-inherited features are additive.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

# --- Redis-backed rate limiting & caching (feature: redis) ---
# tls-rustls enables rediss:// (TLS-encrypted) connections. "script" enables
# redis::Script (EVAL) — used by crates/conduit-ratelimit's atomic
# INCR+EXPIRE fixed-window check (issue #114/#137, ported from main's #345).
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-rustls-comp", "script"] }

# --- Kubernetes provider (optional feature) ---
# Enable with: cargo build --features kubernetes
kube        = { version = "4.0", features = ["runtime", "derive"] }
# Must track the k8s-openapi version kube itself depends on internally (kube 4.0.0 → 0.28) —
# otherwise Cargo resolves two separate k8s-openapi copies and the unfeatured transitive one
# fails to build ("None of the v1_* features are enabled").
k8s-openapi = { version = "0.28" }
schemars    = { version = "1.2" }
futures     = { version = "0.3" }

# --- WASM plugin middleware (optional feature) ---
# Enable with: cargo build --features wasm
# Cranelift JIT: fast compilation; no WASI by default (sandboxed).
wasmtime = { version = "48", features = ["cranelift"] }

# --- OpenTelemetry OTLP tracing (optional feature) ---
# Enable with: cargo build --features otlp
# Exports distributed traces to any OTLP-compatible backend:
# Grafana Tempo, Jaeger, Honeycomb, OpenTelemetry Collector, etc.
# Uses gRPC (tonic) transport; adds ~4 MB to binary.
opentelemetry      = { version = "0.32" }
opentelemetry_sdk  = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }

# --- Dev/test-only ---
criterion   = { version = "0.8", features = ["html_reports"] }
tempfile    = "3"
serial_test = "4"
time        = { version = "0.3", features = ["std"] }
# wat: parse WebAssembly Text Format in tests (compile inline WAT → wasm bytes)
wat         = "1"

[package]
name        = "lopatnov-conduit"
version.workspace    = true
edition.workspace    = true
description = "High-performance reverse proxy and file server built on Cloudflare Pingora"
license.workspace    = true
repository.workspace = true
keywords    = ["proxy", "reverse-proxy", "http", "server", "pingora"]
categories  = ["network-programming", "web-programming::http-server"]
# Internal AI-assistant tooling/runbooks — tracked in git for reproducibility across
# sessions, but not part of the published crate source package.
exclude     = [".claude/**", "CLAUDE.md"]

[[bin]]
name = "conduit"
path = "src/main.rs"

[lib]
name = "conduit"
path = "src/lib.rs"

[dependencies]
# --- Pingora core ---
pingora-core.workspace  = true
pingora-proxy.workspace = true
pingora-cache.workspace = true

# --- Conduit workspace member crates ---
lopatnov-conduit-core.workspace        = true
lopatnov-conduit-config-core.workspace = true
# Mandatory (like the two crates above), not `optional = true`: `OtlpConfig`
# and the `global.otlp` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature mismatch
# instead of the value silently landing nowhere. Only the real exporter is
# gated, via `lopatnov-conduit-otlp/otlp` in the `otlp` feature below.
lopatnov-conduit-otlp.workspace        = true
# Mandatory (like the crates above), not `optional = true`: `AcmeConfig` and
# the `tls.acme` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature mismatch.
# Only the real ACME flow is gated, via `lopatnov-conduit-acme/acme` in the
# `acme` feature below.
lopatnov-conduit-acme.workspace        = true
# Mandatory (like the crates above), not `optional = true`: `TcpConfig` and
# the `sites[].tcp` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature mismatch.
# Only the real TcpProxy is gated, via `lopatnov-conduit-tcp/tcp` in the
# `tcp` feature below.
lopatnov-conduit-tcp.workspace         = true
# Mandatory (like the crates above), not `optional = true`: `UploadConfig`
# and the `sites[].upload` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature mismatch.
# Only the real upload server is gated, via `lopatnov-conduit-upload/upload`
# in the `upload` feature below.
lopatnov-conduit-upload.workspace      = true
# Mandatory (like the crates above), not `optional = true`: `FaultInjectionConfig`
# and the `sites[].faultInjection` field must stay parseable in every build
# so `feature_warnings()` can keep warning on a config-without-feature
# mismatch. Only the real `FaultInjectionGuard` is gated, via
# `lopatnov-conduit-faults/fault-injection` in the `fault-injection` feature
# below.
lopatnov-conduit-faults.workspace      = true
# Mandatory (like the crates above), not `optional = true`: `JwtAuthConfig`
# and the `sites[].jwtAuth` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature
# mismatch. Only the real JWKS/HS256/RS256/ES256 validation and
# `guard::JwtGuard` are gated, via `lopatnov-conduit-auth-jwt/jwt` in the
# `jwt` feature below.
lopatnov-conduit-auth-jwt.workspace    = true
# Mandatory (like the crates above), not `optional = true`: `ForwardAuthConfig`
# and the `sites[].forwardAuth` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature
# mismatch. Only the real `guard::ForwardAuthGuard` is gated, via
# `lopatnov-conduit-auth-forward/forward-auth` in the `forward-auth` feature
# below.
lopatnov-conduit-auth-forward.workspace   = true
# Mandatory (like the crates above), not `optional = true`: `ConsumersConfig`
# and the `sites[].consumers` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature
# mismatch. Only the real `identify::identify_consumer` is gated, via
# `lopatnov-conduit-auth-consumers/consumers` in the `consumers` feature
# below. `ConsumersGuard` itself stays in this crate's own
# `src/filter/chain.rs` — see that crate's `src/lib.rs` doc comment for why
# (issue #114/#134: it also needs this crate's own not-yet-extracted
# `RateLimiter`).
lopatnov-conduit-auth-consumers.workspace = true
# Mandatory (like the crates above), not `optional = true`: `CacheConfig`
# and the `proxy.*.cache` field must stay parseable in every build so
# `feature_warnings()` can keep warning on a config-without-feature
# mismatch. Most of the crate's `cache` module is *also* always compiled
# (matches its pre-extraction gating exactly — see that crate's `src/lib.rs`
# doc comment); only `cache::should_early_refresh` and the entire `redis`
# module are gated, via `lopatnov-conduit-cache/cache` and
# `lopatnov-conduit-cache/redis` below (plain, not weak `?/` — see the
# `redis` feature's own comment for why weak syntax doesn't apply here).
lopatnov-conduit-cache.workspace          = true
# Mandatory, and — unlike every crate above — has no `[features]` table to
# forward into at all: `ipFilter` stays always-on/default-on, never gated
# behind a Cargo feature (`CLAUDE.md` decision #31, 2026-08-23). Owns
# `IpFilterConfig` and the real `guard::IpGuard`, both compiled into every
# build. See that crate's `src/lib.rs` doc comment for why this extraction
# (#114/#136) doesn't follow the config-always-on/guard-feature-gated split
# used by `conduit-faults`/`conduit-auth-jwt`/etc.
lopatnov-conduit-ipfilter.workspace         = true
# Mandatory, no `[features]` table — same always-on rationale as
# `lopatnov-conduit-ipfilter` above (`CLAUDE.md` decision #31). Owns
# `CorsConfig`/`CorsOptions` and the real `guard::CorsPreflight`.
lopatnov-conduit-cors.workspace             = true
# Mandatory, no `[features]` table — same always-on rationale as
# `lopatnov-conduit-ipfilter` above (`CLAUDE.md` decision #31). Owns
# `SecurityHeadersConfig`/`SecurityHeadersOptions` and the real
# `guard::AllowedHostsGuard`.
lopatnov-conduit-security-headers.workspace = true
# Mandatory, no `[features]` table — same always-on rationale as
# `lopatnov-conduit-ipfilter` above (`CLAUDE.md` decision #31's rationale
# extended to rate limiting). Slice 1 of #137: owns `RateLimitConfig` and the
# pure token-bucket admission logic; the Redis backend and `Session`-aware
# wrappers stay in this crate's own `src/filter/rate_limit{,_redis}.rs` for
# now — see `crates/conduit-ratelimit/src/lib.rs` for the full scope note.
lopatnov-conduit-ratelimit.workspace         = true
# Mandatory, no `[features]` table — same always-on rationale as
# `lopatnov-conduit-ipfilter` above (`CLAUDE.md` decision #31). The second
# (final) half of #137: owns `LimitsConfig` and the real `guard::LimitsGuard`
# (Host-header validation, maxRequestHeaders/maxInflightRequests/body/header
# size limits, maxConnectionsPerIp via the RAII `guard::IpConnSlotGuard`).
# Also closes #51 (`limits.minUploadRateBytesPerSec`) — that feature was
# already fully implemented pre-extraction and simply moves along with the
# rest of this crate's scope, no new code needed for it.
lopatnov-conduit-limits.workspace            = true
# Mandatory (like every other crate above), not `optional = true`:
# `CompressionConfig`/`CompressionOptions` and the `sites[].compression`
# field must stay parseable in every build so `feature_warnings()` can keep
# warning on a config-without-feature mismatch. Only the real negotiation
# logic (`CompressOptions`/`effective`/`is_compressible_type`/
# `best_encoding`/`compress_bytes`) is gated, via
# `lopatnov-conduit-compression/compression` in the `compression` feature
# below — unlike every other extracted optional feature so far, `compression`
# stays **default-on** (issue #114/#138): `default` includes it, so a plain
# `cargo build` keeps compressing responses exactly like before this
# extraction; only `--no-default-features` drops it.
lopatnov-conduit-compression.workspace       = true
# Mandatory (like every other crate above), not `optional = true`:
# `StaticConfig`/`StaticOptions`/`FallbackConfig`/`FallbackRule` and the
# `sites[].static`/`sites[].staticOptions`/`sites[].fallback` fields must
# stay parseable in every build so `feature_warnings()` can keep warning on
# a config-without-feature mismatch. Only the real `StaticFileHandler`/
# `FallbackHandler`/`resolve_static_roots` are gated, via
# `lopatnov-conduit-static/static` in the `static` feature below — like
# `compression` (and unlike every other extracted optional feature so far),
# `static` stays **default-on** (issue #114/#139): a plain `cargo build`
# keeps serving static files/fallback responses exactly like before this
# extraction; only `--no-default-features` drops it. This extraction also
# absorbed `humantime`/`libc`/`mime_guess`/`async-compression` out of this
# crate's own direct dependency list below — their only root-crate callers
# (`handler/static_files.rs`, `handler/fallback.rs`, `util/mime.rs`) moved
# into `crates/conduit-static` along with the rest of this scope.
lopatnov-conduit-static.workspace            = true
# Mandatory (like every other crate above), not `optional = true`:
# `HotReloadConfig`/`HotReloadOptions` and the `sites[].hotReload` field must
# stay parseable in every build so `feature_warnings()` can keep warning on
# a config-without-feature mismatch. Only the real `HotReloadJsHandler`/
# `HotReloadSseHandler`/`build_watch_config`/`run_file_watcher` are gated,
# via `lopatnov-conduit-hotreload/hotreload` in the `hotreload` feature
# below — like `compression`/`static` (and unlike every other extracted
# optional feature so far except those two), `hotreload` stays
# **default-on** (issue #114/#140): a plain `cargo build` keeps serving
# `/__hot-reload__`/`/__hot-reload__/client.js` and watching configured
# directories exactly like before this extraction; `--no-default-features`
# drops this crate's own real logic. Note `notify` itself does NOT actually
# leave the dependency tree even then — `lopatnov-conduit-config-core`'s
# unrelated, always-on config-file-reload watcher (`FileProvider`'s
# auto-reload mode, pre-existing since #127) has its own unconditional
# `notify` dependency; see `lopatnov-conduit-hotreload`'s own Cargo.toml for
# the detail.
lopatnov-conduit-hotreload.workspace         = true
# Mandatory, no `[features]` table for the core gate — same always-on
# rationale as `lopatnov-conduit-ipfilter`/`lopatnov-conduit-cors` above
# (`CLAUDE.md` decision #31). Owns `MetricsConfig` and the real
# `handler::MetricsHandler`/`handler::handle_metrics` (`ConduitMetrics`, the
# metric-*registration* struct, stays in this crate). Its own `compression`
# sub-feature (independent of the root crate's `hotreload`/`static`
# features) is forwarded from the root crate's own `compression` feature
# below, mirroring `lopatnov-conduit-static`'s own independent `compression`
# sub-feature.
lopatnov-conduit-metrics.workspace           = true
# Mandatory, no `[features]` table at all — same always-on rationale as
# `lopatnov-conduit-ipfilter`/`lopatnov-conduit-cors` above (`CLAUDE.md`
# decision #31). Owns `RedirectRule` and the real `guard::RedirectGuard`.
lopatnov-conduit-redirects.workspace         = true

# --- Config & parsing ---
serde.workspace      = true
serde_json.workspace = true
serde_yaml.workspace = true
indexmap.workspace   = true

# --- CLI ---
clap.workspace          = true
clap_complete.workspace = true
clap_mangen.workspace   = true
dialoguer.workspace     = true
indicatif.workspace     = true
async-trait.workspace   = true

# --- Pingora HTTP types ---
pingora-http.workspace = true

# --- Async runtime & HTTP ---
tokio.workspace = true
# axum: Admin API always needs axum; multipart feature only needed for file upload
# and is gated behind the `upload` feature (see [features] below).
axum.workspace  = true

# --- Compression ---
# `CompressOptions`/`effective`/`is_compressible_type`/`best_encoding`/
# `compress_bytes` moved to `crates/conduit-compression` (#114/#138), gated
# behind that crate's own `compression` feature. `handler/static_files.rs`'s
# on-the-fly streaming compression (`stream_file_compressed`, which used to
# have a *direct* `async-compression` edge here) moved out entirely along
# with the rest of `static_files.rs` into `crates/conduit-static` (#114/#139)
# — this crate has no remaining direct `async_compression::` usage, so there
# is no root [dependencies] entry to gate behind `compression` here anymore
# (see the `compression` feature below, which now forwards only into the two
# crates that do still use it directly).

# --- Observability ---
tracing.workspace            = true
tracing-subscriber.workspace = true
prometheus.workspace         = true

# --- Performance & state ---
arc-swap.workspace = true
dashmap.workspace  = true

# --- Functionality ---
# mime_guess: no longer a direct root-crate dependency — its only caller
# (`handler/fallback.rs`) moved into `crates/conduit-static` (#114/#139),
# which carries its own gated `mime_guess` edge. See the [dependencies]
# comment on `lopatnov-conduit-static` above.
# notify: no longer a direct root-crate dependency either — its only caller
# (`handler/hot_reload.rs`'s file watcher) moved into
# `crates/conduit-hotreload` (#114/#140), which carries its own gated
# `notify` edge. See the [dependencies] comment on `lopatnov-conduit-hotreload`
# above. (`crates/conduit-config-core`'s own always-on `notify` dependency —
# the unrelated config-file hot-reload watcher, pre-existing and out of
# #140's scope — still pulls it in regardless of this crate's `hotreload`
# feature.)
regex.workspace      = true
uuid.workspace       = true

# --- TLS (always needed) ---
x509-parser.workspace = true

rustls.workspace         = true
rustls-pemfile.workspace = true

# --- Errors & utilities ---
anyhow.workspace    = true
thiserror.workspace = true
bytes.workspace     = true
subtle.workspace    = true
# libc: no longer a direct root-crate dependency — its only caller
# (`handler/static_files.rs`'s O_NOFOLLOW open) moved into
# `crates/conduit-static` (#114/#139), which carries its own gated `libc`
# edge. See the [dependencies] comment on `lopatnov-conduit-static` above.
url.workspace       = true
# httpdate stays unconditional here — logging.rs (access-log CLF dates) and
# response_phase.rs (stale-while-revalidate date handling) both use it
# directly and are unrelated to #114/#139's scope. crates/conduit-static
# carries its own separate, gated `httpdate` edge for ETag/Last-Modified
# formatting in the moved static-file handler.
httpdate.workspace  = true
http.workspace      = true
base64.workspace    = true
hmac.workspace      = true
sha2.workspace      = true

# --- Rhai scripting middleware (feature: rhai) ---
rhai = { workspace = true, optional = true }

# --- HTTP client (feature: jwt for JWKS via crates/conduit-auth-jwt,
# forward-auth, mirroring) ---
# reqwest is NOT optional because traffic mirroring (basic feature) uses it.
# When jwt/forward-auth are disabled, reqwest is still used for mirroring.
# `jsonwebtoken` itself moved to `crates/conduit-auth-jwt` (#114/#133) and is
# no longer a direct root-crate [dependencies] entry — only a
# [dev-dependencies] one below (tests/auth.rs generates test tokens).
reqwest.workspace = true

# Redis-backed rate limiting AND caching both live entirely in their owning
# crates as of #114/#137 slice 2 (rate limiting) / #114/#135 (caching) — the
# root crate has no direct `redis::` usage left, so there is no root
# [dependencies] entry to gate behind `redis` here (see the `redis` feature
# below, which forwards only into those two crates' own `redis` features).
# `crates/conduit-ratelimit`'s own `redis` dependency needs the `script`
# feature too (main's `redis` entry above this merge had it, for the
# INCR+EXPIRE atomic-Lua-script TTL-leak fix ported into that crate below).

# --- Kubernetes provider (optional feature) ---
kube        = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
schemars    = { workspace = true, optional = true }
futures     = { workspace = true, optional = true }

# --- WASM plugin middleware (optional feature) ---
wasmtime = { workspace = true, optional = true }

# --- OpenTelemetry OTLP tracing (optional feature) ---
# `opentelemetry` (base API) is still needed directly here for per-request
# span creation/finishing (`RequestCtx.otel_span`, `request_phase.rs`,
# `logging_phase.rs`) — that stays in the root crate per CLAUDE.md decision
# #30. `opentelemetry_sdk`/`opentelemetry-otlp` (tracer-provider + exporter
# construction) moved to `crates/conduit-otlp` (#129) and are no longer a
# direct root dependency.
opentelemetry = { workspace = true, optional = true }


[features]
# ── Default ────────────────────────────────────────────────────────────────────
# Standard build: core proxy + static files + basic/api-key auth + IP filter +
# rate limiting + CORS + security headers + compression + TLS + health checks +
# Prometheus metrics + hot reload + Admin API + redirects.
#
# No heavyweight optional features compiled in by default — except
# `compression` (issue #114/#138), `static` (issue #114/#139), and
# `hotreload` (issue #114/#140), the three deliberate exceptions: response
# compression, static-file/fallback serving, and browser hot-reload are
# baseline expectations for a reverse proxy/static-file server, so a plain
# `cargo build` must keep behaving exactly like it did before those
# extractions. Enable other individual features or use `full` for a
# batteries-included build; pass `--no-default-features` for a build with
# none of compression, static-file/fallback serving, or hot-reload.
default = ["compression", "static", "hotreload"]

# ── Compression ──────────────────────────────────────────────────────────────
# Response/static-file compression negotiation (br/gzip/deflate/zstd).
# `CompressionConfig`/`CompressionOptions` moved to
# `crates/conduit-compression` (#114/#138) and are always a dependency (see
# the [dependencies] comment above); this forwards into that crate's own
# `compression` feature (gates the real `CompressOptions`/`effective`/
# `is_compressible_type`/`best_encoding`/`compress_bytes`). It also forwards
# into `crates/conduit-static`'s own `compression` feature (#114/#139),
# which gates that crate's on-the-fly streaming compression
# (`stream_file_compressed` — the direct `async-compression` edge that used
# to live here moved there along with the rest of `static_files.rs`), and
# into `crates/conduit-metrics`'s own `compression` feature (#114/#140),
# which gates on-the-fly whole-body compression of the Prometheus
# text-exposition response (issue #338's `compress_small_body` call —
# `conduit-metrics` never needs `async-compression` directly, unlike
# `conduit-static`, since there's no streaming encoder pipeline involved).
# Unlike every other extracted optional feature besides `static`/`hotreload`,
# this one is **default-on** — see `default` above.
compression = [
    "lopatnov-conduit-compression/compression",
    "lopatnov-conduit-static/compression",
    "lopatnov-conduit-metrics/compression",
]

# ── Static files & fallback ──────────────────────────────────────────────────
# Static-file serving (`sites[].static`/`staticOptions`) and fallback
# responses (`sites[].fallback` — 404/SPA-shell/custom body, also the
# terminal "no route matched" handler for every site). `StaticConfig`/
# `StaticOptions`/`FallbackConfig`/`FallbackRule` moved to
# `crates/conduit-static` (#114/#139) and are always a dependency (see the
# [dependencies] comment above); this forwards into that crate's own
# `static` feature, which gates the real `StaticFileHandler`/
# `FallbackHandler`/`resolve_static_roots`. Like `compression` (and unlike
# every other extracted optional feature so far), this one is **default-on**
# — see `default` above. Without it, `sites[].static`/`fallback` still parse
# (and `feature_warnings()` warns): static-file serving becomes unavailable
# (the router never routes to it — see `router.rs::match_static_or_fallback`),
# but the terminal "no route matched" case does NOT become a request-level
# error — `request_phase.rs::build_handler`'s `HandlerKind::Fallback` arm
# always returns a handler, falling back to a bare `PlainNotFoundHandler`
# (plain `404 Not Found`) instead of `FallbackConfig`'s configured behavior.
# This is deliberately different from a feature-specific `LocalHandler`
# variant's own `None` arm (e.g. `HandlerKind::AcmeChallenge` without
# `acme`) because `Fallback` — unlike a specific feature's own request type
# — is the universal fallback-of-last-resort for every unmatched request on
# every site, not exclusive to `static`. (Whether `AcmeChallenge`'s own
# `None` arm is actually safe is a separate, pre-existing question — see
# issue #341, found during this PR's security review but not introduced by
# it and out of this PR's scope to fix.)
static = ["lopatnov-conduit-static/static"]

# ── Browser hot-reload ────────────────────────────────────────────────────────
# `/__hot-reload__` (Server-Sent Events) + `/__hot-reload__/client.js`, and
# the `notify`-backed file watcher that broadcasts a reload signal to every
# connected stream. `HotReloadConfig`/`HotReloadOptions` moved to
# `crates/conduit-hotreload` (#114/#140) and are always a dependency (see
# the [dependencies] comment above); this forwards into that crate's own
# `hotreload` feature, which gates the real `HotReloadJsHandler`/
# `HotReloadSseHandler`/`build_watch_config`/`run_file_watcher` — and, with
# them, this crate's own `notify` dependency (a platform-specific
# filesystem-watcher backend). Note `notify` itself does NOT actually leave
# the overall dependency tree even without this feature —
# `lopatnov-conduit-config-core`'s unrelated, always-on config-file-reload
# watcher (`FileProvider`'s auto-reload mode, pre-existing since #127) has
# its own unconditional `notify` dependency; gating it here is still correct
# for feature-correctness, just not a source of `notify` footprint savings
# by itself. Like `compression`/`static`, this one is **default-on** — see
# `default` above. Without it, `sites[].hotReload`
# still parses (and `feature_warnings()` warns): the router never routes
# `/__hot-reload__`/`/__hot-reload__/client.js` to a hot-reload handler at
# all (`router.rs::is_hot_reload_sse_path`/`is_hot_reload_js_path` are
# themselves gated the same way — issue #341's ACME-challenge fix applied
# proactively here rather than discovered as a gap after the fact), so an
# unmatched request to either path falls through to the site's own
# `fallback`/`static`/`proxy` config exactly like any other unrecognized
# path, not a 502.
hotreload = ["lopatnov-conduit-hotreload/hotreload"]

# ── Authentication ─────────────────────────────────────────────────────────────
# JWT bearer-token validation (HS256 + RS256/ES256 via JWKS URL).
# `JwtAuthConfig` moved to `crates/conduit-auth-jwt` (#114/#133) and is
# always a dependency (see the [dependencies] comment above); this forwards
# into that crate's own `jwt` feature (gates the real JWKS fetch/validation
# and `guard::JwtGuard`) AND into `crates/conduit-auth-consumers`' own `jwt`
# feature (#114/#134) — without the second forward, `--features jwt,consumers`
# would compile `conduit-auth-jwt`'s real code but never activate the
# JWT-credential-checking branch inside `conduit-auth-consumers` (its own
# crate-local `jwt` feature would never be requested by anything), silently
# dropping per-consumer-JWT (V2) and sharedJwt (V3) consumer identification
# even though both root features are on. See that crate's `identify.rs`
# module doc comment.
jwt = ["lopatnov-conduit-auth-jwt/jwt", "lopatnov-conduit-auth-consumers/jwt"]
# Consumer model: per-consumer API-key / Basic Auth / JWT credentials +
# per-consumer rate limits and header injection. `ConsumersConfig` moved to
# `crates/conduit-auth-consumers` (#114/#134) and is always a dependency
# (see the [dependencies] comment above); this only forwards into that
# crate's own `consumers` feature, which gates the real
# `identify::identify_consumer`. `ConsumersGuard` itself (rate-limit step +
# header injection) stays in this crate's `src/filter/chain.rs`.
consumers = ["lopatnov-conduit-auth-consumers/consumers"]
# ForwardAuth: delegate authentication to an external HTTP service.
# `ForwardAuthConfig` moved to `crates/conduit-auth-forward` (#114/#134) and
# is always a dependency (see the [dependencies] comment above); this only
# forwards into that crate's own `forward-auth` feature, which gates the
# real `guard::ForwardAuthGuard`.
forward-auth = ["lopatnov-conduit-auth-forward/forward-auth"]

# ── Scripting & plugins ────────────────────────────────────────────────────────
# Rhai scripting middleware (type: "script" in middleware[]).
rhai = ["dep:rhai"]
# WASM plugin middleware (type: "wasm" in middleware[]).
wasm = ["dep:wasmtime"]

# ── Protocol extensions ────────────────────────────────────────────────────────
# TCP passthrough proxy (type: "tcp" site config). `TcpConfig` moved to
# `crates/conduit-tcp` (#114/#131) and is always a dependency (see the
# [dependencies] comment above); this only forwards into that crate's own
# `tcp` feature, which gates the real `TcpProxy`.
tcp = ["lopatnov-conduit-tcp/tcp"]
# File upload handler (upload: { path, dir } site config). `UploadConfig`
# moved to `crates/conduit-upload` (#114/#131) and is always a dependency
# (see the [dependencies] comment above); this only forwards into that
# crate's own `upload` feature, which gates the real server (and enables
# axum/multipart internally — no longer needed directly here since the
# root crate's own axum usage, e.g. Admin API, never uses `Multipart`).
upload = ["lopatnov-conduit-upload/upload"]

# ── Storage backends ───────────────────────────────────────────────────────────
# Redis-backed rate limiting (rateLimit.store: "redis://...",
# `crates/conduit-ratelimit`'s own `redis` feature, #114/#137 slice 2) AND
# caching (cache.store: "redis://...", `crates/conduit-cache`'s own `redis`
# feature, #114/#135). No root [dependencies] entry to gate here — root has
# no direct `redis::` crate usage as of #137 slice 2 (its last direct call
# site, src/filter/rate_limit_redis.rs, is now a facade over `conduit_
# ratelimit::redis`). Cargo's weak-dependency-feature syntax (`pkg?/feature`)
# was considered to keep the two crates' `redis` features from bleeding into
# each other via Cargo feature unification, but it only applies to *optional*
# dependencies — `cargo check` rejects `?` on `lopatnov-conduit-cache`/
# `lopatnov-conduit-ratelimit` because both are mandatory dependencies (same
# as every other extracted feature crate, since their config types must stay
# always-compiled; see the [dependencies] comment above), so the plain form
# is used instead. The underlying concern is still addressed structurally:
# each crate's `redis` Cargo feature is its own crate-local namespace,
# entirely separate from the other's — enabling one never implicitly enables
# the other, regardless of `?`.
redis = ["lopatnov-conduit-cache/redis", "lopatnov-conduit-ratelimit/redis"]
# Response caching (proxy.*.cache config). `CacheConfig` moved to
# `crates/conduit-cache` (#114/#135) and is always a dependency (see the
# [dependencies] comment above); this forwards into that crate's own `cache`
# feature (a marker feature there too, matching pre-extraction — see that
# crate's `src/lib.rs` doc comment).
cache = ["lopatnov-conduit-cache/cache"]
# Disk cache backend (cache.store: "disk:/path"). Forwards into
# `crates/conduit-cache`'s own `disk-cache` feature (also a marker feature —
# the `disk` module itself has no feature gate, matching pre-extraction).
disk-cache = ["cache", "lopatnov-conduit-cache/disk-cache"]

# ── Auto-TLS ──────────────────────────────────────────────────────────────────
# ACME / Let's Encrypt automatic certificate provisioning (tls.acme config).
# `AcmeConfig` moved to `crates/conduit-acme` (#114/#130) and is always a
# dependency (see the [dependencies] comment above); this only forwards into
# that crate's own `acme` feature, which gates the real ACME flow.
acme = ["lopatnov-conduit-acme/acme"]

# ── Testing / chaos ───────────────────────────────────────────────────────────
# Fault injection for chaos testing (faultInjection config). NOT for production.
# `FaultInjectionConfig` moved to `crates/conduit-faults` (#114/#132) and is
# always a dependency (see the [dependencies] comment above); this only
# forwards into that crate's own `fault-injection` feature, which gates the
# real `FaultInjectionGuard`.
fault-injection = ["lopatnov-conduit-faults/fault-injection"]

# ── Observability ─────────────────────────────────────────────────────────────
# OpenTelemetry OTLP distributed tracing (global.otlp config). `dep:opentelemetry`
# covers this crate's own per-request span code (RequestCtx.otel_span);
# `lopatnov-conduit-otlp/otlp` forwards into the tracer-provider crate (#129).
otlp = ["dep:opentelemetry", "lopatnov-conduit-otlp/otlp"]
# Tokio event-loop lag gauge (conduit_eventloop_lag_ms).
# Uses a yield-probe task that measures scheduling delay — no external deps,
# no tokio_unstable required.  Safe to enable in production.
tokio-metrics = []

# ── Orchestration ─────────────────────────────────────────────────────────────
# Kubernetes CRD watching (--kubernetes-namespace flag).
kubernetes = ["dep:kube", "dep:k8s-openapi", "k8s-openapi/v1_32", "dep:schemars", "dep:futures"]

# ── Convenience bundles ────────────────────────────────────────────────────────
# Standard build: the typical self-hosted reverse-proxy / API-gateway feature
# set — auth stack (JWT + consumers + ForwardAuth), response caching, and
# auto-TLS — without niche or heavyweight extras (scripting, WASM, TCP mode,
# upload, storage backends, chaos testing, tracing, orchestration).
#
# | Profile      | Use case                                              |
# |--------------|-------------------------------------------------------|
# | _(default)_  | Minimal reverse proxy, embed in a larger system       |
# | `standard`   | Self-hosted reverse proxy + API gateway               |
# | `full`       | Every feature — CI / feature exploration              |
standard = [
    "jwt",           # JWT validation (HS256, RS256/ES256, JWKS)
    "consumers",     # Consumer model — per-consumer auth + rate limit
    "forward-auth",  # Delegate auth to an external service
    "cache",         # HTTP response caching
    "acme",          # Auto-TLS via Let's Encrypt (Caddy-style)
    # `compression`, `static`, and `hotreload` are already default-on (see
    # `default` above) — listed here too so `--no-default-features
    # --features standard` still gets them, matching "standard" being a
    # superset of the default feature set.
    "compression",
    "static",
    "hotreload",
]

# Full build: every optional feature enabled.
full = [
    "standard",
    "rhai", "wasm",
    "tcp", "upload",
    "redis", "disk-cache",
    "fault-injection",
    "otlp",
    "tokio-metrics",
    "kubernetes",
]

[dev-dependencies]
# reqwest: adds test-only features (http2/blocking/multipart) on top of the
# main-crate base feature set via workspace-inherited feature union.
reqwest                = { workspace = true, features = ["http2", "blocking", "multipart"] }
criterion.workspace     = true
tempfile.workspace      = true
serial_test.workspace   = true
time.workspace          = true
wat.workspace           = true
# rcgen is used in tests for cert generation even without the acme feature.
rcgen.workspace         = true
# rsa/p256/rand_core: generate throwaway RSA-2048 and P-256 keypairs at
# test-run time for JWKS/RS256/ES256 coverage (issue #164) — see the
# workspace.dependencies comment above. Used here for tests/auth.rs;
# crates/conduit-auth-jwt has its own identical dev-dependency edge for its
# own JWKS unit tests (#133).
rsa.workspace           = true
p256.workspace          = true
rand_core.workspace     = true
# jsonwebtoken is used in auth integration tests (tests/auth.rs) to generate
# test tokens. Listed as dev-dep (not [dependencies], which no longer has a
# jsonwebtoken entry at all — the real JWT validation code moved to
# crates/conduit-auth-jwt, #114/#133) so these tests compile without
# --features jwt. `use_pem` is needed only here (RS256/ES256 JWKS test
# tokens, issue #164) — added via feature union on top of the workspace base
# set (same pattern as reqwest above).
jsonwebtoken = { workspace = true, features = ["use_pem"] }

[[test]]
name = "acme"
required-features = ["acme"]

[[test]]
name = "cache"
required-features = ["cache"]

[[test]]
name = "compression"
required-features = ["compression"]

[[test]]
name = "fault_injection"
required-features = ["fault-injection"]

[[test]]
name = "forward_auth"
required-features = ["forward-auth"]

[[test]]
name = "static_files"
required-features = ["static"]

[[test]]
name = "fallback"
required-features = ["static"]

[[test]]
name = "browser_hot_reload"
required-features = ["hotreload"]

[[test]]
name = "pre_compressed"
required-features = ["static"]

[[test]]
name = "upload"
required-features = ["upload"]

[[bench]]
name = "logging_phase_labels"
harness = false

[profile.release]
lto           = true
codegen-units = 1
strip         = true
