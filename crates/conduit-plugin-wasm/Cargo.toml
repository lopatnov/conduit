[package]
name        = "lopatnov-conduit-plugin-wasm"
version.workspace    = true
edition.workspace    = true
description = "WASM plugin middleware backend for conduit's feature-driven workspace (issue #114/#141)"
license.workspace    = true
repository.workspace = true

[lib]
name = "conduit_plugin_wasm"
path = "src/lib.rs"

[dependencies]
# No [features] table at all — unlike most sibling extractions, this crate's
# entire reason to exist IS the "wasm" feature: whether it's compiled into
# the dependency graph at all is controlled from conduit-middleware's own
# Cargo.toml (`wasm = ["dep:lopatnov-conduit-plugin-wasm", ...]`), not from a
# feature table here. So every dependency below is mandatory. No
# `lopatnov-conduit-core` dependency either — this crate implements no chain
# trait (`RequestFilter`/`ResponseFilter`); it takes only primitives
# (`WasmRequest`/`WasmResponseContext` are plain structs) and hands back
# outcome enums for conduit-middleware's guard/response-filter to interpret
# (see CONTRIBUTING.md's "conduit-core dependency is opt-in, not automatic").
wasmtime = { workspace = true }
bytes    = { workspace = true }
dashmap  = { workspace = true }
anyhow   = { workspace = true }
tracing  = { workspace = true }

[dev-dependencies]
wat      = { workspace = true }
tempfile = { workspace = true }
