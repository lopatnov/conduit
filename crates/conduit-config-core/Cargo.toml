[package]
name        = "lopatnov-conduit-config-core"
version.workspace    = true
edition.workspace    = true
description = "Layer-0 config-loading mechanism for conduit's feature-driven workspace (issue #114/#127) — generic over the config payload type, zero schema knowledge"
license.workspace    = true
repository.workspace = true

[lib]
name = "conduit_config_core"
path = "src/lib.rs"

[dependencies]
serde               = { workspace = true }
serde_json          = { workspace = true }
serde_yaml          = { workspace = true }
serde_path_to_error = { workspace = true }
anyhow              = { workspace = true }
async-trait         = { workspace = true }
tokio               = { workspace = true }
notify              = { workspace = true }
tracing             = { workspace = true }

[dev-dependencies]
tempfile    = { workspace = true }
serial_test = { workspace = true }
