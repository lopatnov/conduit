[package]
name        = "lopatnov-conduit-core"
version.workspace    = true
edition.workspace    = true
description = "Layer-0 traits and primitives for conduit's feature-driven workspace (issue #114/#126) — zero config knowledge, pingora + std only"
license.workspace    = true
repository.workspace = true

[lib]
name = "conduit_core"
path = "src/lib.rs"

[dependencies]
pingora-core  = { workspace = true }
pingora-proxy = { workspace = true }
pingora-http  = { workspace = true }
async-trait   = { workspace = true }
bytes         = { workspace = true }
mime_guess    = { workspace = true }
# Constant-time string comparison (util::crypto::ct_eq_str), shared by the
# root crate's always-on Basic Auth / API-key guards and
# crates/conduit-auth-consumers' consumer-credential checks (#114/#134).
subtle        = { workspace = true }
# O_NOFOLLOW for atomic symlink-safe log file open (Unix) — issue #280.
libc          = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true }
