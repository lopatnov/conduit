name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        # --workspace covers member crates too (e.g. conduit-core, #114/#126) --
        # they have no [features] of their own, so this job (matrix'd across
        # all 3 OSes) is where they get exercised; ci-features/ci-standard
        # stay root-package-only since those exist to test feature combos the
        # member crates don't have. --tests lints #[cfg(test)] code too (#219) --
        # without it, cfg(test) never activates and inline test blocks are
        # silently never linted at all.
        run: cargo clippy --workspace --tests -- -D warnings

      - name: test
        run: cargo test --workspace

  # ── Declared MSRV (1.89) still compiles ─────────────────────────────────────
  # `rust-version = "1.89"` (workspace root) was only a claim until this job:
  # every other job builds on `stable`. This one `cargo check`s the default and
  # `standard`/`kubernetes` builds on the floor (the floor is set by kube 4.2). Tests are not run here: a dev-dependency
  # (`serial_test 4`) needs 1.93.1. `--features wasm`/`full` have a higher floor
  # (conduit-plugin-wasm's own `rust-version`) and are not covered.
  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: check (default features)
        run: cargo check --locked -p lopatnov-conduit

      - name: check (standard features)
        run: cargo check --locked -p lopatnov-conduit --features standard

      # kube 4.2 is what sets the 1.89 floor; default/standard do not pull it in.
      - name: check (kubernetes)
        run: cargo check --locked -p lopatnov-conduit --features kubernetes

  # ── Build + test with all optional features enabled ─────────────────────────
  ci-features:
    name: All features (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: features-all
        continue-on-error: true

      # The root, the request pipeline (`conduit-runtime`, #145), the Admin API (`conduit-admin`, #146) and the server
      # bootstrap/CLI dispatch (`conduit-server`/`conduit-cli`, #147) are named together: a package named only by the
      # root's `--features` would not run its own tests, and the admin crate's `cache` tests (the purge endpoint)
      # exist only when the root's `cache` feature reaches it.
      - name: clippy (all features)
        run: cargo clippy -p lopatnov-conduit -p lopatnov-conduit-runtime -p lopatnov-conduit-admin -p lopatnov-conduit-server -p lopatnov-conduit-cli --features full --tests -- -D warnings

      - name: test (all features)
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime -p lopatnov-conduit-admin -p lopatnov-conduit-server -p lopatnov-conduit-cli --features full

  # ── Build + test with the `standard` feature bundle ──────────────────────────
  # Matches the feature set shipped in release.yml's un-suffixed binaries and
  # the un-suffixed Docker image — see Cargo.toml [features] `standard`.
  ci-standard:
    name: Standard feature bundle (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: features-standard
        continue-on-error: true  # transient cache failures must not abort the build

      - name: clippy (standard features)
        run: cargo clippy -p lopatnov-conduit -p lopatnov-conduit-runtime -p lopatnov-conduit-admin -p lopatnov-conduit-server -p lopatnov-conduit-cli --features standard --tests -- -D warnings

      - name: test (standard features)
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime -p lopatnov-conduit-admin -p lopatnov-conduit-server -p lopatnov-conduit-cli --features standard

  # ── Footprint report: stripped binary size + dep count per feature profile ──
  # Makes the migration's value measurable and catches silent footprint
  # regressions as crates get added. Metric definitions match footprint-auditor
  # (.claude/agents/footprint-auditor.md): `ls -l` on the release binary
  # (strip = true already set in [profile.release]) and
  # `cargo tree ... -e normal | wc -l` as the dependency-count proxy. See #114/#119.
  #
  # Split in two jobs (#461) so that no token with write scope shares a job with
  # code from the repository. `footprint` builds the workspace -- which runs the
  # `build.rs` and proc-macros of every dependency, including a bumped one in a
  # Dependabot PR -- with `contents: read` / `pull-requests: read` only, and hands
  # the table over as a job output. `footprint-comment` has `pull-requests: write`
  # and executes nothing from the pull request: it checks out only `scripts/ci`
  # from the DEFAULT branch, receives the table through `env:` (never through
  # `${{ }}` inside a `run:` script), works out the PR number itself and posts.
  # The cost: a change to scripts/ci/ takes effect for these comments only after
  # it is merged. Fork PRs get a read-only token from GitHub, so the comment job's
  # POST is rejected there and the report stays in the `footprint` job log.
  #
  # Posting is a plain `curl` + the automatically-provided GITHUB_TOKEN rather
  # than a third-party Action, keeping this workflow's supply-chain surface to the
  # pins already vetted elsewhere in this file.
  #
  # Branches with a PR whose CI runs through the `push` trigger (no
  # `github.event.pull_request`) are handled by scripts/ci/resolve_pr.sh, which
  # looks up the open PR for the branch. No open PR (a bare push) means no comment
  # target -- the measurement still runs so a break here is caught in CI logs.
  footprint:
    name: Footprint report
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report: ${{ steps.measure.outputs.report }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: footprint
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Measure footprint per profile
        id: measure
        run: |
          set -euo pipefail
          {
            echo "Profile | Binary size (release, stripped) | Deps (cargo tree, normal)"
            echo "---|---|---"
          } > /tmp/footprint-table.md

          measure() {
            local flags="$1" label="$2"
            cargo build --release $flags -q
            local size_bytes
            size_bytes=$(stat -c%s target/release/conduit)
            local size_human
            size_human=$(numfmt --to=iec-i --suffix=B --format="%.1f" "$size_bytes")
            local dep_count
            dep_count=$(cargo tree $flags -e normal | wc -l)
            echo "$label | ${size_human} (${size_bytes} bytes) | ${dep_count}" >> /tmp/footprint-table.md
          }

          measure "--no-default-features" "\`--no-default-features\`"
          measure "--no-default-features --features static" "\`--no-default-features --features static\`"
          measure "" "default"
          measure "--features standard" "\`standard\`"
          measure "--features full" "\`full\`"

          # Multi-line job output with a random delimiter, written after the
          # last repository-controlled command of this step has finished.
          delim="REPORT_$(openssl rand -hex 16)"
          {
            echo "report<<$delim"
            cat /tmp/footprint-table.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  footprint-comment:
    name: Footprint report comment
    needs: footprint
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the sparse checkout of scripts/ci
      pull-requests: write  # the comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # `hashFiles` guards the one-off case of the PR that introduces these scripts:
      # the default branch does not have them yet, so that PR gets no comment
      # instead of a red job. From the next PR on they are there.
      - name: Find associated PR number
        id: pr
        if: hashFiles('scripts/ci/resolve_pr.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci/resolve_pr.sh >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- footprint-report -->"
          HEADING: "## 📦 Footprint report"
          REPORT: ${{ needs.footprint.outputs.report }}
        run: |
          set -euo pipefail
          python3 scripts/ci/build_report_body.py /tmp/comment-body.md
          ./scripts/ci/post_or_update_pr_comment.sh /tmp/comment-body.md

  # ── Performance report: informational throughput/latency, one profile ───────
  # Companion to the footprint job above — that one catches silent binary-size
  # regressions, this one catches silent throughput/latency regressions the
  # same way. Deliberately informational only (not a required status check —
  # nothing in this repo's branch ruleset names this job), since a single
  # shared CI runner's wrk/oha numbers are inherently noisier run-to-run than
  # a binary-size measurement; a hard gate here would produce false-positive
  # reds. Runs one scenario (reverse-proxy passthrough, matching
  # docs/benchmarks.md's own "Reverse Proxy Passthrough" table) against the
  # `default` feature profile — the one most users actually run, and the one
  # under discussion when this job was added (a Step 1c-style investigation
  # found `default`'s footprint had grown ~21% for identical functionality
  # since before the Conduit 2.0 workspace migration, #114 — this job exists
  # so a distributed regression like that gets caught per-PR instead of only
  # by an occasional manual audit).
  #
  # `oha` (https://github.com/hatoo/oha) instead of `wrk` (which the docs'
  # manual methodology uses): a single pinned static Linux binary needs no
  # apt/luarocks build step, and its `--output-format json` `metrics` object
  # is explicitly documented as "CI friendly statistics" — stable field names
  # (`requests_per_sec`, `latency_ms.p50/p95/p99`, `success_rate`) instead of
  # regex-scraping wrk's human-oriented text output. The binary is verified
  # against a pinned SHA-256 before it is made executable (#461).
  #
  # Builds and benchmarks the PR head, then (same job, sequential — avoids a
  # second full matrix job just for one extra data point) checks out and
  # benchmarks the PR's base commit for a head-vs-base delta.
  #
  # Split like the footprint job (#461): `performance` runs repository code
  # (cargo build, then the freshly built binary) with read-only scopes and hands
  # the numbers over as job outputs; `performance-comment` holds the write token,
  # runs nothing from the pull request and formats the comment with
  # scripts/ci/performance_report.py from the default branch. Own marker, so the
  # reports do not collide.
  performance:
    name: Performance report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # base-SHA lookup on `push` runs (scripts/ci/resolve_pr.sh)
    outputs:
      head_rps: ${{ steps.bench.outputs.head_rps }}
      head_p50: ${{ steps.bench.outputs.head_p50 }}
      head_p99: ${{ steps.bench.outputs.head_p99 }}
      head_ok: ${{ steps.bench.outputs.head_ok }}
      base_rps: ${{ steps.bench.outputs.base_rps }}
      base_p50: ${{ steps.bench.outputs.base_p50 }}
      base_p99: ${{ steps.bench.outputs.base_p99 }}
      base_ok: ${{ steps.bench.outputs.base_ok }}
      hw: ${{ steps.hw.outputs.summary }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: "1.24"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: performance
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install oha (load generator)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/oha \
            https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          echo "620bb9e16fb53eabc9a3fc45f88bdb41fefa3fee5c05e75892011ce320391716  /tmp/oha" | sha256sum -c -
          sudo install -m 0755 /tmp/oha /usr/local/bin/oha
          oha --version

      # GitHub-hosted runners land on different CPU generations from one run
      # to the next, so absolute numbers aren't comparable across PRs unless
      # you know the machine — record it next to the results. Purely
      # informational: `run:` steps default to `bash -e`, so errexit is still
      # on here — but every fallible lookup ends in `|| true` or a `:-`
      # placeholder, so a missing /proc field can't fail the job (the only
      # remaining failure path is the final write to $GITHUB_OUTPUT).
      - name: Capture runner hardware
        id: hw
        run: |
          set -uo pipefail
          cpu=$(grep -m1 '^model name' /proc/cpuinfo | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r\n' || true)
          mem_gb=$(awk '/^MemTotal:/ {printf "%.0f", $2 / 1024 / 1024}' /proc/meminfo || true)
          # Lead with what this job was actually given (vCPU/RAM of the runner
          # VM); the CPU string is the *host* chip's marketing name (e.g. a
          # "96-Core Processor" on a 4-vCPU runner), so label it as such rather
          # than let it read like an allocation.
          echo "summary=$(nproc) vCPU, ${mem_gb:-?} GB RAM allocated to this job (host CPU model: ${cpu:-unknown}), ${ImageOS:-linux} (${RUNNER_ARCH:-x64})" >> "$GITHUB_OUTPUT"

      - name: Write minimal Go echo upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench-upstream
          cat > /tmp/bench-upstream/main.go <<'GOEOF'
          package main

          import (
              "net/http"
              "time"
          )

          func main() {
              body := []byte(`{"status":"ok","ts":0}`)
              http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                  w.Header().Set("Content-Type", "application/json")
                  w.Write(body)
              })
              srv := &http.Server{Addr: ":4000", ReadTimeout: 5 * time.Second}
              srv.ListenAndServe()
          }
          GOEOF
          cd /tmp/bench-upstream && go mod init bench-upstream && go build -o /tmp/bench-upstream-bin .

      # #114 sub-issue PRs run through the `push` trigger, not `pull_request`;
      # resolve_pr.sh gives the PR's base SHA either way, so the measurement
      # step below has something to diff the head build against.
      - name: Find associated PR + base SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci/resolve_pr.sh >> "$GITHUB_OUTPUT"

      - name: Measure PR head and base
        id: bench
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail

          start_upstream() {
            /tmp/bench-upstream-bin &
            UPSTREAM_PID=$!
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:4000/ > /dev/null 2>&1 && return 0
              sleep 0.5
            done
            echo "upstream never became ready" >&2; exit 1
          }

          start_conduit() {
            printf '{ "port": 8080, "proxy": "http://127.0.0.1:4000" }' > /tmp/bench-conduit.json
            ./target/release/conduit -c /tmp/bench-conduit.json &
            CONDUIT_PID=$!
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:8080/__health__ > /dev/null 2>&1 && return 0
              sleep 0.5
            done
            echo "conduit never became ready" >&2; exit 1
          }

          # The numbers are collected into /tmp/bench-outputs and written to
          # $GITHUB_OUTPUT once, at the very end, after the last binary built
          # from repository code has stopped.
          : > /tmp/bench-outputs
          measure() {
            local label="$1"
            cargo build --release -q
            start_upstream
            start_conduit
            oha -z 10s -c 50 --no-tui --output-format json http://127.0.0.1:8080/ > "/tmp/oha-${label}.json"
            kill "$CONDUIT_PID" "$UPSTREAM_PID" 2>/dev/null || true
            wait "$CONDUIT_PID" "$UPSTREAM_PID" 2>/dev/null || true

            python3 -c "
          import json
          m = json.load(open('/tmp/oha-${label}.json'))['metrics']
          print(f'${label}_rps={round(m[\"requests_per_sec\"])}')
          print(f'${label}_p50={round(m[\"latency_ms\"][\"p50\"], 2)}')
          print(f'${label}_p99={round(m[\"latency_ms\"][\"p99\"], 2)}')
          print(f'${label}_ok={round(m[\"success_rate\"] * 100, 1)}')
          " >> /tmp/bench-outputs
          }

          measure head

          if [ -n "$BASE_SHA" ]; then
            head_sha=$(git rev-parse HEAD)
            git fetch --depth 1 origin "$BASE_SHA" 2>/dev/null || true
            git checkout --quiet "$BASE_SHA"
            measure base
            git checkout --quiet "$head_sha"
          fi

          cat /tmp/bench-outputs >> "$GITHUB_OUTPUT"

  performance-comment:
    name: Performance report comment
    needs: performance
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the sparse checkout of scripts/ci
      pull-requests: write  # the comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # See the note on the same step in `footprint-comment`.
      - name: Find associated PR number
        id: pr
        if: hashFiles('scripts/ci/resolve_pr.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci/resolve_pr.sh >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- performance-report -->"
          HEAD_RPS: ${{ needs.performance.outputs.head_rps }}
          HEAD_P50: ${{ needs.performance.outputs.head_p50 }}
          HEAD_P99: ${{ needs.performance.outputs.head_p99 }}
          HEAD_OK: ${{ needs.performance.outputs.head_ok }}
          BASE_RPS: ${{ needs.performance.outputs.base_rps }}
          BASE_P50: ${{ needs.performance.outputs.base_p50 }}
          BASE_P99: ${{ needs.performance.outputs.base_p99 }}
          BASE_OK: ${{ needs.performance.outputs.base_ok }}
          HW: ${{ needs.performance.outputs.hw }}
        run: |
          set -euo pipefail
          python3 scripts/ci/performance_report.py /tmp/comment-body.md
          ./scripts/ci/post_or_update_pr_comment.sh /tmp/comment-body.md

  # ── Feature-gating isolation check (cargo-hack) ──────────────────────────────
  # Proves each optional feature actually compiles *in isolation* — the
  # default/all-features/standard-bundle jobs above only ever build feature
  # unions, so a feature that silently depends on another (or on something
  # only dev-deps happen to pull in) would slip through undetected otherwise.
  # --no-dev-deps is what makes this meaningful: without it, jsonwebtoken and
  # rcgen (declared as dev-deps for tests) mask real gating gaps by being
  # present regardless of which --features flag is passed. See #114/#118.
  # ── Workspace layer-boundary guard (issue #114/#125) ─────────────────────
  # No-ops today (crates/ has no member crates yet) — establishes the
  # guardrail ahead of Phase 2+ extractions, so a Layer-1 feature crate
  # reaching into SiteConfig/AppConfig directly fails fast in CI instead of
  # being discovered mid-Phase-5.
  layer-boundaries:
    name: Layer boundaries (SiteConfig/AppConfig)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check Layer-1 crates don't reference SiteConfig/AppConfig
        run: ./scripts/check-layer-boundaries.sh

  # ── Code length report: Rust files over the soft (400) / hard (1000) limits ─
  # Counts *code* lines (comments, blank lines and tests excluded) with
  # scripts/check_file_length.py and posts the result as a PR comment, so a PR
  # shows at a glance whether it pushed a file past the limits in
  # `.claude/rules/conventions.md` ("File length"), and which touched files got
  # longer. Informational, like the footprint/performance reports: a file being
  # over a limit does NOT fail the job (it is listed in the report), only a
  # broken counter does — its own unit tests run first.
  #
  # Split like the footprint job (#461): `code-length` runs the repository's
  # Python scripts with read-only scopes and hands the report over as a job
  # output; `code-length-comment` holds the write token, runs nothing from the
  # pull request and posts it (same sparse checkout of scripts/ci from the
  # default branch, same PR lookup for `push`-triggered runs). On a fork
  # `pull_request` run GitHub forces the token read-only, so the POST is simply
  # rejected and the report stays in the job log.
  code-length:
    name: Code length report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # base-SHA lookup on `push` runs (scripts/ci/resolve_pr.sh)
    outputs:
      report: ${{ steps.measure.outputs.report }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the base commit is needed to tell which files the PR touched

      - name: Unit-test the counter
        run: python3 scripts/test_check_file_length.py

      - name: Unit-test the move verifier
        run: python3 scripts/test_verify_move.py

      - name: Unit-test the report scripts
        run: python3 scripts/ci/test_report_scripts.py

      - name: Unit-test the version bump script
        run: python3 scripts/test_bump_version.py

      - name: Find associated PR and its base commit
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci/resolve_pr.sh >> "$GITHUB_OUTPUT"

      - name: Measure code lines
        id: measure
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            python3 scripts/check_file_length.py --base "$BASE_SHA" --markdown /tmp/length-report.md
          else
            python3 scripts/check_file_length.py --markdown /tmp/length-report.md
          fi
          delim="REPORT_$(openssl rand -hex 16)"
          {
            echo "report<<$delim"
            cat /tmp/length-report.md
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

  code-length-comment:
    name: Code length report comment
    needs: code-length
    runs-on: ubuntu-latest
    permissions:
      contents: read        # the sparse checkout of scripts/ci
      pull-requests: write  # the comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      # See the note on the same step in `footprint-comment`.
      - name: Find associated PR number
        id: pr
        if: hashFiles('scripts/ci/resolve_pr.sh') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: ./scripts/ci/resolve_pr.sh >> "$GITHUB_OUTPUT"

      - name: Post/update PR comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- code-length-report -->"
          REPORT: ${{ needs.code-length.outputs.report }}
        run: |
          set -euo pipefail
          python3 scripts/ci/build_report_body.py /tmp/comment-body.md
          ./scripts/ci/post_or_update_pr_comment.sh /tmp/comment-body.md

  ci-hack:
    name: Feature isolation (cargo-hack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: hack-each-feature
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install cargo-hack
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e  # v2.85.4
        with:
          tool: cargo-hack

      # `--workspace` (issue #144): a bare `cargo hack` only iterates the *root*
      # package's features. Member crates' own features (e.g.
      # `lopatnov-conduit-proxy-http/proxy` and `lopatnov-conduit-upstream/proxy`)
      # are forwarded from the root's `proxy` feature since PR 4a -- before that
      # the root pinned them on unconditionally, so their feature-OFF states
      # were never compiled by CI at all -- but the crates' *own* feature-OFF
      # states (a crate built alone, without its `proxy`) are still only
      # reached by `--workspace`, which checks every member crate with each of
      # its own features and with none. A gating regression in one would
      # otherwise only surface much later. Expect this job to run noticeably
      # longer than a root-only run.
      - name: cargo hack check --workspace --each-feature --no-dev-deps
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # ── Feature-OFF tests (issue #144) ──────────────────────────────────────────
  # `cargo hack --no-dev-deps` above only *compiles* each feature state — it
  # never runs a test — so what a build WITHOUT `proxy` actually does (the
  # router ignoring `sites[].proxy`, a `routes[]` proxy action ending in the
  # fallback and never in its dead `static` half, `feature_warnings()`) was
  # untested. Unit tests first; the integration tests under `tests/` run last, in
  # the `static-server` shape (the default set minus `proxy`), where the ones
  # that proxy real traffic are compiled out by their `required-features`/`cfg`.
  ci-no-proxy:
    name: Tests without the `proxy` feature
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: no-proxy
        continue-on-error: true  # transient cache failures must not abort the build

      # `-p lopatnov-conduit-runtime` next to the root in every run below: the request pipeline (routing, guards, phases —
      # ~300 unit tests, including the no-`proxy` router ones) lives in that crate since #145, and a run naming only the root
      # package would silently stop running them in exactly the profiles that exist to cover them.
      - name: Unit tests, --no-default-features
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --lib --no-default-features

      # A separate invocation on purpose. Until PR 4a the root pinned this
      # crate's `proxy` feature on unconditionally, so putting the root package
      # in the same `cargo test` unified it in and the crate was silently tested
      # WITH the feature (140 tests instead of the 58 that exist without it).
      # The pin is gone (the root's `proxy` now forwards instead), but a
      # dedicated run stays the clearest statement of what is being tested, and
      # the dependency leak check below fails if such a pin ever comes back on
      # either crate (`hmac`/`sha2` for `lopatnov-conduit-proxy-http`, `reqwest`
      # for `lopatnov-conduit-upstream`).
      - name: Unit tests, conduit-proxy-http alone without its `proxy` feature
        run: cargo test -p lopatnov-conduit-proxy-http --lib --no-default-features

      # With `static` back on, a proxy+static `routes[]` entry COULD be served
      # as a file root if the router got this wrong, so this is the run where
      # the terminal-Fallback test is decisive (with `static` off a StaticFile
      # can't be produced at all).
      - name: Unit tests, --no-default-features --features static
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --lib --no-default-features --features static

      # `upload` is served through `upstream_peer` (an `UpstreamTarget::Upload`
      # classifies as `HandlerKind::Proxy`), so the real `upstream_peer` /
      # `resolve_peer_addr` must still compile and work WITHOUT `proxy`. With
      # neither feature on, `upstream_peer` is a 404 stub (the plain
      # `--no-default-features` run above covers that one).
      - name: Unit tests, --no-default-features --features upload
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --lib --no-default-features --features upload

      # `consumers` without `jwt` is the only profile in which the "consumers
      # use `sharedJwt`/a consumer `jwt` credential but `jwt` is not compiled"
      # warning can fire (no other CI profile has `consumers` on and `jwt` off),
      # so this is where the golden test for `feature_warnings()` covers it
      # (`src/config/validate/golden_tests.rs`, issue #316).
      - name: Unit tests, --no-default-features --features consumers
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --lib --no-default-features --features consumers

      # The mirror image: `redis` on and `consumers` off. The multiple-Redis-URLs
      # warning lists different URLs in the two cases (per-consumer stores are only
      # scanned with `consumers`), and no other CI profile has this combination, so
      # this is where the `[redis,!consumers]` variant of the golden is checked.
      - name: Unit tests, --no-default-features --features redis
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --lib --no-default-features --features redis

      # The integration tests spawn the real `conduit` binary, so this is also
      # the only place a build without `proxy` is exercised end to end. The
      # tests that proxy real traffic are compiled out (a file-level
      # `required-features = ["proxy"]` in Cargo.toml, or a per-test
      # `#[cfg(feature = "proxy")]` where a file also holds tests that are
      # meaningful without it); everything that remains must pass. `static-server`
      # (rather than a bare `--no-default-features`) because the static-file,
      # compression and hot-reload tests need their own features -- it is the
      # default set minus `proxy`, so it isolates exactly what `proxy` gates.
      - name: Integration tests, --no-default-features --features static-server
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --no-default-features --features static-server --tests

      # The auth/scripting features without `proxy` (#449). Their integration
      # tests mostly watch what reaches a proxied echo upstream, so the ones
      # that need `proxy` carry a per-test `#[cfg(feature = "proxy")]`; this run
      # keeps that gating honest -- a test that needs a proxy but is not gated
      # fails here instead of only for someone who hand-picks these features.
      - name: Integration tests, static-server + auth/scripting features without proxy
        run: cargo test -p lopatnov-conduit -p lopatnov-conduit-runtime --no-default-features --features static-server,jwt,consumers,forward-auth,rhai,fault-injection,upload,tcp --tests

      # The property #144 exists for: a build without `proxy` must not carry
      # proxy-only dependencies: the sticky-session stack (`hmac`, `sha2`), the
      # HTTP client used for mirroring/early refresh (`reqwest`, `tower-http`) and
      # the URL parser (`url`, `idna`, `icu_*`) -- the last two only come back
      # with `proxy`, `forward-auth` or `cache`. Things that make a naive check
      # pass forever: `cargo tree -i <crate>` on an ABSENT crate prints
      # "nothing to print" and still exits 0, so the exit code proves nothing --
      # use a positive match on the crate list; `-e normal` is mandatory,
      # because the dev-dependencies (reqwest, ...) are in the graph otherwise;
      # and the list itself must be proven non-empty first, because a
      # failing `cargo tree` (bad feature name, resolution error) would
      # otherwise yield an empty list that trivially "contains no leaks".
      #
      # Checked for every feature set that must stay free of them: `static` and
      # `static-server` (the two ways to keep serving files without `proxy`) and
      # `upload` and `tcp` (features that are served or used without a reverse
      # proxy and must not drag the proxy stack back in). `jwt`, `forward-auth`
      # and `cache` are deliberately absent: they legitimately bring `reqwest`,
      # `url` and `tower-http` back (and `cache` implies `proxy`).
      - name: Dependency leak check, --no-default-features with static / static-server / upload / tcp
        run: |
          set -euo pipefail
          for features in static static-server upload tcp; do
            echo "== --no-default-features --features $features"
            crates=$(cargo tree -p lopatnov-conduit --no-default-features --features "$features" \
                       -e normal --prefix none | sed 's/ v.*//' | sort -u)
            # No `-q`: `grep -q` exits at the first match and, under `pipefail`, a
            # still-writing `printf` could die of SIGPIPE on a longer list and turn a
            # good list into a spurious failure. Draining the pipe avoids that.
            if ! printf '%s\n' "$crates" | grep -x 'lopatnov-conduit' > /dev/null; then
              echo "cargo tree produced no usable crate list; refusing to pass vacuously"
              exit 1
            fi
            # grep exits 1 for "no match" (the good case) but 2 for an error such as a
            # broken pattern -- `|| true` would treat both as "clean", so only exit 1
            # is tolerated here.
            leaked=$(printf '%s\n' "$crates" | grep -xE 'hmac|sha2|reqwest|tower-http|url|idna|icu_.*' || [ "$?" -eq 1 ])
            if [ -n "$leaked" ]; then
              echo "proxy-only dependencies leaked into a build without the proxy feature:"
              echo "$leaked"
              exit 1
            fi
          done

  # ── Cross-compile smoke tests for non-native architectures ──────────────────
  # Mirrors the `use_cross: true` targets in release.yml's build matrix, but
  # only exercises a release build (no test run / no artifact upload) — just
  # enough to catch target-specific compile breakage early. Add a line to
  # `matrix.target` to cover another architecture; no other changes needed.
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: cross-${{ matrix.target }}
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install cross
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: cross

      - name: Build (cross, standard)
        run: cross build --release --target ${{ matrix.target }} --features standard

  # ── ACME integration tests (Linux only, requires Docker for Pebble) ─────────
  acme:
    name: ACME (Pebble)
    runs-on: ubuntu-latest

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
        ports:
          - 14000:14000
          - 15000:15000  # management API (ghcr.io image uses 15000, not 5002)
        env:
          # Skip real HTTP-01 validation so tests don't need a public address.
          PEBBLE_VA_ALWAYS_VALID: "1"
          # Remove the sleep before validation to speed up tests.
          PEBBLE_VA_NOSLEEP: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Wait for Pebble to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir > /dev/null && echo "Pebble ready" && exit 0
            sleep 2
          done
          echo "Pebble did not start in time" && exit 1

      - name: Extract Pebble TLS CA cert
        run: |
          # Pebble uses a static minica test CA (pebble.minica.pem) to sign its
          # own HTTPS server certificate on ports 14000 and 15000.  This is
          # separate from the dynamically-generated ACME issuing CA returned by
          # /roots/0.  We must trust pebble.minica.pem so that instant-acme can
          # verify Pebble's TLS cert when contacting the ACME directory endpoint.
          PEBBLE_ID=$(docker ps -q --filter ancestor=ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 | head -1)
          docker cp "$PEBBLE_ID:/test/certs/pebble.minica.pem" /tmp/pebble-ca.pem
          # Confirm we have a valid PEM cert; fail loudly if not.
          openssl x509 -in /tmp/pebble-ca.pem -noout -subject

      - name: Build (debug for faster CI)
        run: cargo build --features acme

      - name: Run ACME tests
        env:
          # Trust Pebble's static TLS CA so instant-acme can verify Pebble's
          # server certificate when connecting to https://localhost:14000/dir.
          # Account::builder_with_root() is used when this env var is set.
          CONDUIT_ACME_EXTRA_ROOT: /tmp/pebble-ca.pem
        run: cargo test --test acme --features acme -- --nocapture

  # ── Workspace publish pre-flight (issue #114/#148) ──────────────────────────
  # release.yml's publish-crates job (see scripts/publish-workspace.sh) does a
  # real `cargo publish --workspace` on every tag. This job proves that would
  # actually succeed on every PR, without touching crates.io: `cargo publish
  # --dry-run` packages every member (in dependency order, path deps stripped
  # to their `version` string) and compiles each tarball as if it only had
  # its published siblings available. Catches a missing description/license,
  # an accidentally-non-pathed file the crate needs, or a version drift the
  # check-workspace-versions.sh script below doesn't (that script only checks
  # the literal strings in Cargo.toml; this compiles the result).
  workspace-publish-dryrun:
    name: Workspace publish dry-run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Check every workspace-dependency version is in lockstep
        run: ./scripts/check-workspace-versions.sh

      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run

  # ── Config schema superset check (issue #496) ────────────────────────────────
  # schema/conduit.schema.json is hand-maintained, not generated from serde —
  # nothing else catches a config field added/renamed in Rust without a matching
  # schema update. scripts/check_schema_superset.py is a best-effort net, not a
  # guarantee (see its own docstring for exactly what it can't check — untagged
  # enums, #[serde(flatten)] fields, defs inlined into a parent instead of named).
  schema-superset-check:
    name: Config schema superset check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Validate schema/conduit.schema.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('schema/conduit.schema.json','utf8'))"

      - name: Check the schema hasn't drifted from the Rust config structs it can verify
        run: python3 scripts/check_schema_superset.py
