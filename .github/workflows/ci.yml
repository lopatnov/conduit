name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        # --workspace covers member crates too (e.g. conduit-core, #114/#126) --
        # they have no [features] of their own, so this job (matrix'd across
        # all 3 OSes) is where they get exercised; ci-features/ci-standard
        # stay root-package-only since those exist to test feature combos the
        # member crates don't have. --tests lints #[cfg(test)] code too (#219) --
        # without it, cfg(test) never activates and inline test blocks are
        # silently never linted at all.
        run: cargo clippy --workspace --tests -- -D warnings

      - name: test
        run: cargo test --workspace

  # ── Build + test with all optional features enabled ─────────────────────────
  ci-features:
    name: All features (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: features-all
        continue-on-error: true

      - name: clippy (all features)
        run: cargo clippy --features full --tests -- -D warnings

      - name: test (all features)
        run: cargo test --features full

  # ── Build + test with the `standard` feature bundle ──────────────────────────
  # Matches the feature set shipped in release.yml's un-suffixed binaries and
  # the un-suffixed Docker image — see Cargo.toml [features] `standard`.
  ci-standard:
    name: Standard feature bundle (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: features-standard
        continue-on-error: true  # transient cache failures must not abort the build

      - name: clippy (standard features)
        run: cargo clippy --features standard --tests -- -D warnings

      - name: test (standard features)
        run: cargo test --features standard

  # ── Footprint report: stripped binary size + dep count per feature profile ──
  # Makes the migration's value measurable and catches silent footprint
  # regressions as crates get added. Metric definitions match footprint-auditor
  # (.claude/agents/footprint-auditor.md): `ls -l` on the release binary
  # (strip = true already set in [profile.release]) and
  # `cargo tree ... -e normal | wc -l` as the dependency-count proxy. See #114/#119.
  #
  # Deliberately posts via a plain `curl` + the automatically-provided
  # GITHUB_TOKEN rather than adding a new third-party Action — keeps this
  # workflow's supply-chain surface to only the pins already vetted elsewhere
  # in this file. GITHUB_TOKEN is read-only-forced by GitHub itself on
  # pull_request runs from forks, so `pull-requests: write` here can't be
  # abused cross-repo.
  #
  # Sub-issue PRs in this migration target `claude/cargo-workspace-features-
  # 23qxfr`, not `main`, and the `pull_request` trigger above is scoped to
  # `branches: [main]` — so those PRs' CI actually runs via the `push` trigger,
  # where `github.event.pull_request` doesn't exist. The "find associated PR"
  # step below covers both cases: use the event context on an actual
  # `pull_request` run, otherwise look up the open PR for this branch via the
  # API. No open PR (e.g. a bare push) means no comment target — the
  # measurement step still runs so a break here is still caught in CI logs.
  footprint:
    name: Footprint report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: footprint
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Measure footprint per profile
        run: |
          set -euo pipefail
          {
            echo "Profile | Binary size (release, stripped) | Deps (cargo tree, normal)"
            echo "---|---|---"
          } > /tmp/footprint-table.md

          measure() {
            local flags="$1" label="$2"
            cargo build --release $flags -q
            local size_bytes
            size_bytes=$(stat -c%s target/release/conduit)
            local size_human
            size_human=$(numfmt --to=iec-i --suffix=B --format="%.1f" "$size_bytes")
            local dep_count
            dep_count=$(cargo tree $flags -e normal | wc -l)
            echo "$label | ${size_human} (${size_bytes} bytes) | ${dep_count}" >> /tmp/footprint-table.md
          }

          measure "--no-default-features" "\`--no-default-features\`"
          measure "--no-default-features --features static" "\`--no-default-features --features static\`"
          measure "" "default"
          measure "--features standard" "\`standard\`"
          measure "--features full" "\`full\`"

      - name: Find associated PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            number=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?head=$REPO_OWNER:$REF_NAME&state=open" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Post/update PR comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- footprint-report -->"
        run: |
          set -euo pipefail
          { echo "$MARKER"; echo; echo "## 📦 Footprint report"; echo; cat /tmp/footprint-table.md; } > /tmp/comment-body.md

          existing_id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            | python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          marker = os.environ['MARKER']
          for c in data:
              if marker in c['body']:
                  print(c['id'])
                  break
          ")

          payload=$(python3 -c "
          import json
          with open('/tmp/comment-body.md') as f:
              print(json.dumps({'body': f.read()}))
          ")

          if [ -n "$existing_id" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/comments/$existing_id" -d "$payload" > /dev/null
          else
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" -d "$payload" > /dev/null
          fi

  # ── Performance report: informational throughput/latency, one profile ───────
  # Companion to the footprint job above — that one catches silent binary-size
  # regressions, this one catches silent throughput/latency regressions the
  # same way. Deliberately informational only (not a required status check —
  # nothing in this repo's branch ruleset names this job), since a single
  # shared CI runner's wrk/oha numbers are inherently noisier run-to-run than
  # a binary-size measurement; a hard gate here would produce false-positive
  # reds. Runs one scenario (reverse-proxy passthrough, matching
  # docs/benchmarks.md's own "Reverse Proxy Passthrough" table) against the
  # `default` feature profile — the one most users actually run, and the one
  # under discussion when this job was added (a Step 1c-style investigation
  # found `default`'s footprint had grown ~21% for identical functionality
  # since before the Conduit 2.0 workspace migration, #114 — this job exists
  # so a distributed regression like that gets caught per-PR instead of only
  # by an occasional manual audit).
  #
  # `oha` (https://github.com/hatoo/oha) instead of `wrk` (which the docs'
  # manual methodology uses): a single pinned static Linux binary needs no
  # apt/luarocks build step, and its `--output-format json` `metrics` object
  # is explicitly documented as "CI friendly statistics" — stable field names
  # (`requests_per_sec`, `latency_ms.p50/p95/p99`, `success_rate`) instead of
  # regex-scraping wrk's human-oriented text output.
  #
  # Builds and benchmarks the PR head, then (same job, sequential — avoids a
  # second full matrix job just for one extra data point) checks out and
  # benchmarks the PR's base commit for a head-vs-base delta. Posts via the
  # same plain-curl + GITHUB_TOKEN pattern as the footprint job, own comment
  # (own marker) so the two reports don't collide.
  performance:
    name: Performance report
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00  # v6.0.0
        with:
          go-version: "1.24"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: performance
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install oha (load generator)
        run: |
          set -euo pipefail
          curl -sSL -o /usr/local/bin/oha \
            https://github.com/hatoo/oha/releases/download/v1.16.0/oha-linux-amd64
          chmod +x /usr/local/bin/oha
          oha --version

      # GitHub-hosted runners land on different CPU generations from one run
      # to the next, so absolute numbers aren't comparable across PRs unless
      # you know the machine — record it next to the results. Purely
      # informational: `run:` steps default to `bash -e`, so errexit is still
      # on here — but every fallible lookup ends in `|| true` or a `:-`
      # placeholder, so a missing /proc field can't fail the job (the only
      # remaining failure path is the final write to $GITHUB_OUTPUT).
      - name: Capture runner hardware
        id: hw
        run: |
          set -uo pipefail
          cpu=$(grep -m1 '^model name' /proc/cpuinfo | sed 's/^[^:]*:[[:space:]]*//' | tr -d '\r\n' || true)
          mem_gb=$(awk '/^MemTotal:/ {printf "%.0f", $2 / 1024 / 1024}' /proc/meminfo || true)
          # Lead with what this job was actually given (vCPU/RAM of the runner
          # VM); the CPU string is the *host* chip's marketing name (e.g. a
          # "96-Core Processor" on a 4-vCPU runner), so label it as such rather
          # than let it read like an allocation.
          echo "summary=$(nproc) vCPU, ${mem_gb:-?} GB RAM allocated to this job (host CPU model: ${cpu:-unknown}), ${ImageOS:-linux} (${RUNNER_ARCH:-x64})" >> "$GITHUB_OUTPUT"

      - name: Write minimal Go echo upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/bench-upstream
          cat > /tmp/bench-upstream/main.go <<'GOEOF'
          package main

          import (
              "net/http"
              "time"
          )

          func main() {
              body := []byte(`{"status":"ok","ts":0}`)
              http.HandleFunc("/", func(w http.ResponseWriter, r *http.Request) {
                  w.Header().Set("Content-Type", "application/json")
                  w.Write(body)
              })
              srv := &http.Server{Addr: ":4000", ReadTimeout: 5 * time.Second}
              srv.ListenAndServe()
          }
          GOEOF
          cd /tmp/bench-upstream && go mod init bench-upstream && go build -o /tmp/bench-upstream-bin .

      # Same "find associated PR" reasoning as the footprint job above (#114
      # sub-issue PRs target the migration branch via `push`, not
      # `pull_request`) — additionally resolves the PR's base SHA so the
      # measurement step below has something to diff the head build against.
      - name: Find associated PR + base SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "number=$EVENT_PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "base_sha=$EVENT_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            pr_json=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/pulls?head=$REPO_OWNER:$REF_NAME&state=open")
            echo "number=$(echo "$pr_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')")" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(echo "$pr_json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['base']['sha'] if d else '')")" >> "$GITHUB_OUTPUT"
          fi

      - name: Measure PR head and base
        id: bench
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail

          start_upstream() {
            /tmp/bench-upstream-bin &
            UPSTREAM_PID=$!
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:4000/ > /dev/null 2>&1 && return 0
              sleep 0.5
            done
            echo "upstream never became ready" >&2; exit 1
          }

          start_conduit() {
            printf '{ "port": 8080, "proxy": "http://127.0.0.1:4000" }' > /tmp/bench-conduit.json
            ./target/release/conduit -c /tmp/bench-conduit.json &
            CONDUIT_PID=$!
            for _ in $(seq 1 30); do
              curl -sf http://127.0.0.1:8080/__health__ > /dev/null 2>&1 && return 0
              sleep 0.5
            done
            echo "conduit never became ready" >&2; exit 1
          }

          measure() {
            local label="$1"
            cargo build --release -q
            start_upstream
            start_conduit
            oha -z 10s -c 50 --no-tui --output-format json http://127.0.0.1:8080/ > "/tmp/oha-${label}.json"
            kill "$CONDUIT_PID" "$UPSTREAM_PID" 2>/dev/null || true
            wait "$CONDUIT_PID" "$UPSTREAM_PID" 2>/dev/null || true

            python3 -c "
          import json
          m = json.load(open('/tmp/oha-${label}.json'))['metrics']
          print(f'${label}_rps={round(m[\"requests_per_sec\"])}')
          print(f'${label}_p50={round(m[\"latency_ms\"][\"p50\"], 2)}')
          print(f'${label}_p99={round(m[\"latency_ms\"][\"p99\"], 2)}')
          print(f'${label}_ok={round(m[\"success_rate\"] * 100, 1)}')
          " >> "$GITHUB_OUTPUT"
          }

          measure head

          if [ -n "$BASE_SHA" ]; then
            git fetch --depth 1 origin "$BASE_SHA" 2>/dev/null || true
            git checkout --quiet "$BASE_SHA"
            measure base
          fi

      - name: Post/update PR comment
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          MARKER: "<!-- performance-report -->"
          HEAD_RPS: ${{ steps.bench.outputs.head_rps }}
          HEAD_P50: ${{ steps.bench.outputs.head_p50 }}
          HEAD_P99: ${{ steps.bench.outputs.head_p99 }}
          HEAD_OK: ${{ steps.bench.outputs.head_ok }}
          BASE_RPS: ${{ steps.bench.outputs.base_rps }}
          BASE_P50: ${{ steps.bench.outputs.base_p50 }}
          BASE_P99: ${{ steps.bench.outputs.base_p99 }}
          BASE_OK: ${{ steps.bench.outputs.base_ok }}
          HW: ${{ steps.hw.outputs.summary }}
        run: |
          set -euo pipefail
          python3 -c "
          import json, os

          def f(name):
              v = os.environ.get(name, '')
              return float(v) if v else None

          head = {'rps': f('HEAD_RPS'), 'p50': f('HEAD_P50'), 'p99': f('HEAD_P99'), 'ok': f('HEAD_OK')}
          base = {'rps': f('BASE_RPS'), 'p50': f('BASE_P50'), 'p99': f('BASE_P99'), 'ok': f('BASE_OK')}
          hw = ' '.join(os.environ.get('HW', '').split())

          def delta(k, higher_is_better):
              if base[k] is None or base[k] == 0:
                  return '—'
              pct = (head[k] - base[k]) / base[k] * 100
              arrow = '▲' if pct > 0 else ('▼' if pct < 0 else '—')
              good = (pct > 0) == higher_is_better
              sign = '+' if pct > 0 else ''
              flag = ' ⚠️' if abs(pct) >= 10 and not good else ''
              return f'{arrow} {sign}{pct:.1f}%{flag}'

          lines = ['<!-- performance-report -->', '', '## ⚡ Performance report', '',
                   '_Reverse-proxy passthrough, \`default\` feature profile, \`oha -z 10s -c 50\` — informational only, not a merge gate; single shared CI runner, treat as a trend signal, not a lab measurement._', '']

          if base['rps'] is None:
              lines += ['Metric | PR head', '---|---',
                        f\"Requests/sec | {head['rps']:.0f}\",
                        f\"p50 latency | {head['p50']:.2f} ms\",
                        f\"p99 latency | {head['p99']:.2f} ms\",
                        f\"Success rate | {head['ok']:.1f}%\",
                        '', '_No base commit measured (couldn'\"'\"'t resolve this PR'\"'\"'s base SHA) — nothing to diff against._']
          else:
              lines += ['Metric | Base | PR head | Δ', '---|---|---|---',
                        f\"Requests/sec | {base['rps']:.0f} | {head['rps']:.0f} | {delta('rps', True)}\",
                        f\"p50 latency | {base['p50']:.2f} ms | {head['p50']:.2f} ms | {delta('p50', False)}\",
                        f\"p99 latency | {base['p99']:.2f} ms | {head['p99']:.2f} ms | {delta('p99', False)}\",
                        f\"Success rate | {base['ok']:.1f}% | {head['ok']:.1f}% | {delta('ok', True)}\"]

          if hw:
              if base['rps'] is not None:
                  note = 'GitHub-hosted runner hardware varies between runs, so read the Δ column (base and head are measured back-to-back on this same machine) rather than comparing absolute numbers across PRs.'
              else:
                  note = 'GitHub-hosted runner hardware varies between runs, so absolute numbers are not comparable across PRs.'
              lines += ['', f'**Runner:** {hw}. ' + note]

          with open('/tmp/comment-body.md', 'w') as fh:
              fh.write('\n'.join(lines) + '\n')
          "

          existing_id=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            | python3 -c "
          import json, os, sys
          data = json.load(sys.stdin)
          marker = os.environ['MARKER']
          for c in data:
              if marker in c['body']:
                  print(c['id'])
                  break
          ")

          payload=$(python3 -c "
          import json
          with open('/tmp/comment-body.md') as f:
              print(json.dumps({'body': f.read()}))
          ")

          if [ -n "$existing_id" ]; then
            curl -sS -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/comments/$existing_id" -d "$payload" > /dev/null
          else
            curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" -d "$payload" > /dev/null
          fi

  # ── Feature-gating isolation check (cargo-hack) ──────────────────────────────
  # Proves each optional feature actually compiles *in isolation* — the
  # default/all-features/standard-bundle jobs above only ever build feature
  # unions, so a feature that silently depends on another (or on something
  # only dev-deps happen to pull in) would slip through undetected otherwise.
  # --no-dev-deps is what makes this meaningful: without it, jsonwebtoken and
  # rcgen (declared as dev-deps for tests) mask real gating gaps by being
  # present regardless of which --features flag is passed. See #114/#118.
  # ── Workspace layer-boundary guard (issue #114/#125) ─────────────────────
  # No-ops today (crates/ has no member crates yet) — establishes the
  # guardrail ahead of Phase 2+ extractions, so a Layer-1 feature crate
  # reaching into SiteConfig/AppConfig directly fails fast in CI instead of
  # being discovered mid-Phase-5.
  layer-boundaries:
    name: Layer boundaries (SiteConfig/AppConfig)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check Layer-1 crates don't reference SiteConfig/AppConfig
        run: ./scripts/check-layer-boundaries.sh

  ci-hack:
    name: Feature isolation (cargo-hack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: hack-each-feature
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install cargo-hack
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e  # v2.85.4
        with:
          tool: cargo-hack

      # `--workspace` (issue #144): a bare `cargo hack` only iterates the *root*
      # package's features. Member crates' own features (e.g.
      # `lopatnov-conduit-proxy-http/proxy` and `lopatnov-conduit-upstream/proxy`)
      # are forwarded from the root's `proxy` feature since PR 4a -- before that
      # the root pinned them on unconditionally, so their feature-OFF states
      # were never compiled by CI at all -- but the crates' *own* feature-OFF
      # states (a crate built alone, without its `proxy`) are still only
      # reached by `--workspace`, which checks every member crate with each of
      # its own features and with none. A gating regression in one would
      # otherwise only surface much later. Expect this job to run noticeably
      # longer than a root-only run.
      - name: cargo hack check --workspace --each-feature --no-dev-deps
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # ── Feature-OFF unit tests (issue #144) ─────────────────────────────────────
  # `cargo hack --no-dev-deps` above only *compiles* each feature state — it
  # never runs a test — so what a build WITHOUT `proxy` actually does (the
  # router ignoring `sites[].proxy`, a `routes[]` proxy action ending in the
  # fallback and never in its dead `static` half, `feature_warnings()`) was
  # untested. Library unit tests only: the integration tests under `tests/`
  # proxy real traffic and get their own `required-features` in a later #144 PR.
  ci-no-proxy:
    name: Unit tests without the `proxy` feature
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: no-proxy-unit
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Unit tests, --no-default-features
        run: cargo test -p lopatnov-conduit --lib --no-default-features

      # A separate invocation on purpose. Until PR 4a the root pinned this
      # crate's `proxy` feature on unconditionally, so putting the root package
      # in the same `cargo test` unified it in and the crate was silently tested
      # WITH the feature (140 tests instead of the 58 that exist without it).
      # The pin is gone (the root's `proxy` now forwards instead), but a
      # dedicated run stays the clearest statement of what is being tested, and
      # the dependency leak check below fails if such a pin ever comes back on
      # either crate (`hmac`/`sha2` for `lopatnov-conduit-proxy-http`, `reqwest`
      # for `lopatnov-conduit-upstream`).
      - name: Unit tests, conduit-proxy-http alone without its `proxy` feature
        run: cargo test -p lopatnov-conduit-proxy-http --lib --no-default-features

      # With `static` back on, a proxy+static `routes[]` entry COULD be served
      # as a file root if the router got this wrong, so this is the run where
      # the terminal-Fallback test is decisive (with `static` off a StaticFile
      # can't be produced at all).
      - name: Unit tests, --no-default-features --features static
        run: cargo test -p lopatnov-conduit --lib --no-default-features --features static

      # `upload` is served through `upstream_peer` (an `UpstreamTarget::Upload`
      # classifies as `HandlerKind::Proxy`), so the real `upstream_peer` /
      # `resolve_peer_addr` must still compile and work WITHOUT `proxy`. With
      # neither feature on, `upstream_peer` is a 404 stub (the plain
      # `--no-default-features` run above covers that one).
      - name: Unit tests, --no-default-features --features upload
        run: cargo test -p lopatnov-conduit --lib --no-default-features --features upload

      # The property #144 exists for: a build without `proxy` must not carry
      # proxy-only dependencies: the sticky-session stack (`hmac`, `sha2`), the
      # HTTP client used for mirroring/early refresh (`reqwest`, `tower-http`) and
      # the URL parser (`url`, `idna`, `icu_*`) -- the last two only come back
      # with `proxy`, `forward-auth` or `cache`. Things that make a naive check
      # pass forever: `cargo tree -i <crate>` on an ABSENT crate prints
      # "nothing to print" and still exits 0, so the exit code proves nothing --
      # use a positive match on the crate list; `-e normal` is mandatory,
      # because the dev-dependencies (reqwest, ...) are in the graph otherwise;
      # and the list itself must be proven non-empty first, because a
      # failing `cargo tree` (bad feature name, resolution error) would
      # otherwise yield an empty list that trivially "contains no leaks".
      - name: Dependency leak check, --no-default-features --features static
        run: |
          set -euo pipefail
          crates=$(cargo tree -p lopatnov-conduit --no-default-features --features static \
                     -e normal --prefix none | sed 's/ v.*//' | sort -u)
          # No `-q`: `grep -q` exits at the first match and, under `pipefail`, a
          # still-writing `printf` could die of SIGPIPE on a longer list and turn a
          # good list into a spurious failure. Draining the pipe avoids that.
          if ! printf '%s\n' "$crates" | grep -x 'lopatnov-conduit' > /dev/null; then
            echo "cargo tree produced no usable crate list; refusing to pass vacuously"
            exit 1
          fi
          # grep exits 1 for "no match" (the good case) but 2 for an error such as a
          # broken pattern -- `|| true` would treat both as "clean", so only exit 1
          # is tolerated here.
          leaked=$(printf '%s\n' "$crates" | grep -xE 'hmac|sha2|reqwest|tower-http|url|idna|icu_.*' || [ "$?" -eq 1 ])
          if [ -n "$leaked" ]; then
            echo "proxy-only dependencies leaked into a build without the proxy feature:"
            echo "$leaked"
            exit 1
          fi

  # ── Cross-compile smoke tests for non-native architectures ──────────────────
  # Mirrors the `use_cross: true` targets in release.yml's build matrix, but
  # only exercises a release build (no test run / no artifact upload) — just
  # enough to catch target-specific compile breakage early. Add a line to
  # `matrix.target` to cover another architecture; no other changes needed.
  cross-compile:
    name: Cross-compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv64gc-unknown-linux-gnu

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: cross-${{ matrix.target }}
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Install cross
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: cross

      - name: Build (cross, standard)
        run: cross build --release --target ${{ matrix.target }} --features standard

  # ── ACME integration tests (Linux only, requires Docker for Pebble) ─────────
  acme:
    name: ACME (Pebble)
    runs-on: ubuntu-latest

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199
        ports:
          - 14000:14000
          - 15000:15000  # management API (ghcr.io image uses 15000, not 5002)
        env:
          # Skip real HTTP-01 validation so tests don't need a public address.
          PEBBLE_VA_ALWAYS_VALID: "1"
          # Remove the sleep before validation to speed up tests.
          PEBBLE_VA_NOSLEEP: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Wait for Pebble to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir > /dev/null && echo "Pebble ready" && exit 0
            sleep 2
          done
          echo "Pebble did not start in time" && exit 1

      - name: Extract Pebble TLS CA cert
        run: |
          # Pebble uses a static minica test CA (pebble.minica.pem) to sign its
          # own HTTPS server certificate on ports 14000 and 15000.  This is
          # separate from the dynamically-generated ACME issuing CA returned by
          # /roots/0.  We must trust pebble.minica.pem so that instant-acme can
          # verify Pebble's TLS cert when contacting the ACME directory endpoint.
          PEBBLE_ID=$(docker ps -q --filter ancestor=ghcr.io/letsencrypt/pebble@sha256:ddf230642b1a584f519f32e347de1b05a6e4c1f6c35c1863b33effeab5f78199 | head -1)
          docker cp "$PEBBLE_ID:/test/certs/pebble.minica.pem" /tmp/pebble-ca.pem
          # Confirm we have a valid PEM cert; fail loudly if not.
          openssl x509 -in /tmp/pebble-ca.pem -noout -subject

      - name: Build (debug for faster CI)
        run: cargo build --features acme

      - name: Run ACME tests
        env:
          # Trust Pebble's static TLS CA so instant-acme can verify Pebble's
          # server certificate when connecting to https://localhost:14000/dir.
          # Account::builder_with_root() is used when this env var is set.
          CONDUIT_ACME_EXTRA_ROOT: /tmp/pebble-ca.pem
        run: cargo test --test acme --features acme -- --nocapture
