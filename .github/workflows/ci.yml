name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test

  # ── ACME integration tests (Linux only, requires Docker for Pebble) ─────────
  acme:
    name: ACME (Pebble)
    runs-on: ubuntu-latest

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - 14000:14000
          - 5002:5002
        env:
          # Skip real HTTP-01 validation so tests don't need a public address.
          PEBBLE_VA_ALWAYS_VALID: "1"
          # Remove the sleep before validation to speed up tests.
          PEBBLE_VA_NOSLEEP: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Wait for Pebble to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir > /dev/null && echo "Pebble ready" && exit 0
            sleep 2
          done
          echo "Pebble did not start in time" && exit 1

      - name: Install Pebble root CA in system trust store
        run: |
          # Pebble serves its root CA over HTTP on the management port.
          curl -s http://localhost:5002/roots/0 \
            -o /usr/local/share/ca-certificates/pebble-root.crt
          update-ca-certificates
        # instant-acme uses hyper-rustls with rustls-native-certs which reads
        # the system CA store — this makes it trust Pebble's self-signed cert.

      - name: Build (debug for faster CI)
        run: cargo build

      - name: Run ACME tests
        run: cargo test --test acme -- --nocapture
