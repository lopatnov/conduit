name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        continue-on-error: true  # transient cache failures must not abort the build

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy -- -D warnings

      - name: test
        run: cargo test

  # ── ACME integration tests (Linux only, requires Docker for Pebble) ─────────
  acme:
    name: ACME (Pebble)
    runs-on: ubuntu-latest

    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - 14000:14000
          - 15000:15000  # management API (ghcr.io image uses 15000, not 5002)
        env:
          # Skip real HTTP-01 validation so tests don't need a public address.
          PEBBLE_VA_ALWAYS_VALID: "1"
          # Remove the sleep before validation to speed up tests.
          PEBBLE_VA_NOSLEEP: "1"

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        continue-on-error: true  # transient cache failures must not abort the build

      - name: Wait for Pebble to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sk https://localhost:14000/dir > /dev/null && echo "Pebble ready" && exit 0
            sleep 2
          done
          echo "Pebble did not start in time" && exit 1

      - name: Download Pebble root CA for ACME tests
        run: |
          # Pebble's management API (port 15000, HTTPS with self-signed cert) serves
          # the root CA at /roots/0.  -k skips verification of Pebble's own TLS cert.
          # The cert may arrive as DER; convert to PEM so instant-acme can load it.
          curl -skf https://localhost:15000/roots/0 > /tmp/pebble-root-raw
          # Try DER → PEM conversion first; fall back to treating the response as PEM.
          openssl x509 -inform DER -in /tmp/pebble-root-raw -out /tmp/pebble-root.pem 2>/dev/null \
            || cp /tmp/pebble-root-raw /tmp/pebble-root.pem
          # Verify we have a valid PEM cert; fail loudly if not.
          openssl x509 -in /tmp/pebble-root.pem -noout -subject

      - name: Build (debug for faster CI)
        run: cargo build

      - name: Run ACME tests
        env:
          # Tell Conduit to trust Pebble's self-signed root CA.
          # instant-acme will use Account::builder_with_root() when this is set.
          CONDUIT_ACME_EXTRA_ROOT: /tmp/pebble-root.pem
        run: cargo test --test acme -- --nocapture
