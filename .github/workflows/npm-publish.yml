name: Publish to npm + GitHub Packages (manual)

# Use this workflow when the npm publish step of the Release workflow fails.
# It downloads bare binaries from the existing GitHub Release and publishes
# to both npmjs.com and GitHub Packages.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write   # required for npm provenance attestation (Trusted Publisher)

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-npm:
    name: Publish to npm + GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Extract version from tag
        id: version
        run: echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      # Download bare binaries from the GitHub Release assets.
      # These are the same binaries that were built and attached by the Release workflow.
      - name: Download binaries from GitHub Release
        run: |
          mkdir -p npm/bin/native
          VERSION="${{ steps.version.outputs.version }}"
          BASE="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"

          declare -A ASSETS=(
            ["conduit-x86_64-unknown-linux-gnu"]="conduit-x86_64-unknown-linux-gnu"
            ["conduit-x86_64-unknown-linux-musl"]="conduit-x86_64-unknown-linux-musl"
            ["conduit-aarch64-unknown-linux-gnu"]="conduit-aarch64-unknown-linux-gnu"
            ["conduit-x86_64-apple-darwin"]="conduit-x86_64-apple-darwin"
            ["conduit-aarch64-apple-darwin"]="conduit-aarch64-apple-darwin"
            ["conduit-x86_64-pc-windows-msvc.exe"]="conduit-x86_64-pc-windows-msvc.exe"
          )

          for ASSET_NAME in "${!ASSETS[@]}"; do
            DEST="npm/bin/native/${ASSETS[$ASSET_NAME]}"
            echo "Downloading $ASSET_NAME → $DEST"
            curl -fsSL "$BASE/$ASSET_NAME" -o "$DEST"
          done

      - name: Set executable bit on Unix binaries
        run: chmod +x npm/bin/native/conduit-*-linux-* npm/bin/native/conduit-*-darwin* 2>/dev/null || true

      - name: Set package version
        working-directory: npm
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      # ── Publish to npmjs.com ────────────────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npmjs.com
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # ── Publish to GitHub Packages ──────────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
