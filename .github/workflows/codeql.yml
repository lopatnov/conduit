name: CodeQL Analysis

on:
  push:
    branches: [main, phase-next]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan: Monday 08:00 UTC
    - cron: "0 8 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read
  packages: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub Actions workflow files
          - language: actions
            build-mode: none

          # Rust source — CodeQL uses its own extractor; build-mode: none is the only supported mode
          - language: rust
            build-mode: none

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b22c66273205240d86582638b860f9b25772b4d3  # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Note: do NOT add custom queries here — conflicts with GitHub Default Setup.
          # Switch repo to "Advanced setup" in Settings → Code Security to enable custom packs.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b22c66273205240d86582638b860f9b25772b4d3  # v3
        with:
          category: "/language:${{ matrix.language }}"
