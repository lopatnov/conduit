name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Dependabot PRs only bump CI action pins — no Rust code changes.
    # Running coverage + SonarCloud scan wastes ~10 minutes for zero benefit.
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Hard cap: coverage generation + sonar scan should finish well within 20 min.
    # Without this the job can hang for GitHub's default 6-hour timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0  # full history required for blame / new-code detection
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview  # required by cargo-llvm-cov

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        continue-on-error: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419  # v2.82.7
        with:
          tool: cargo-llvm-cov

      # Generate LCOV coverage from unit tests only (--lib).
      # Integration tests spawn servers and make network calls — they take too
      # long under instrumentation and can hang the job for hours.
      # Unit tests alone give reliable coverage data in < 2 minutes.
      - name: Generate coverage (LCOV, unit tests only)
        run: |
          cargo llvm-cov \
            --lib \
            --features full \
            --lcov \
            --output-path coverage.lcov \
            --ignore-filename-regex '(tests/|build\.rs)'
        env:
          RUST_LOG: "error"  # silence tracing output so coverage stats stay clean

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e  # v8.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=coverage.lcov
