name: SonarCloud

on:
  push:
    branches: [main, security/v1.1.0-stabilize]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Hard cap: coverage generation + sonar scan should finish well within 20 min.
    # Without this the job can hang for GitHub's default 6-hour timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # full history required for blame / new-code detection
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview  # required by cargo-llvm-cov

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        continue-on-error: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e  # v2.81.7
        with:
          tool: cargo-llvm-cov

      # Generate LCOV coverage from unit tests only (--lib).
      # Integration tests spawn servers and make network calls — they take too
      # long under instrumentation and can hang the job for hours.
      # Unit tests alone give reliable coverage data in < 2 minutes.
      - name: Generate coverage (LCOV, unit tests only)
        run: |
          cargo llvm-cov \
            --lib \
            --features full \
            --lcov \
            --output-path coverage.lcov \
            --ignore-filename-regex '(tests/|build\.rs)'
        env:
          RUST_LOG: "error"  # silence tracing output so coverage stats stay clean

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995  # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=coverage.lcov
