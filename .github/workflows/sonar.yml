name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Dependabot PRs only bump CI action pins — no Rust code changes.
    # Running coverage + SonarCloud scan wastes ~10 minutes for zero benefit.
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sonar:
    name: SonarCloud analysis
    runs-on: ubuntu-latest
    # Hard cap: coverage generation + sonar scan should finish well within 20 min.
    # Without this the job can hang for GitHub's default 6-hour timeout.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history required for blame / new-code detection
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de  # stable
        with:
          toolchain: stable
          components: llvm-tools-preview  # required by cargo-llvm-cov

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        continue-on-error: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29  # v2.87.21
        with:
          tool: cargo-llvm-cov

      # Generate LCOV coverage from unit tests only (--lib).
      # Integration tests spawn servers and make network calls — they take too
      # long under instrumentation and can hang the job for hours.
      # Unit tests alone give reliable coverage data in < 2 minutes.
      - name: Generate coverage (LCOV, unit tests only)
        run: |
          cargo llvm-cov \
            --lib \
            --features full \
            --lcov \
            --output-path coverage.lcov \
            --ignore-filename-regex '(tests/|build\.rs)'
        env:
          RUST_LOG: "error"  # silence tracing output so coverage stats stay clean

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4  # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.rust.lcov.reportPaths=coverage.lcov
