name: Semgrep

# Semgrep SAST scan — follows the official recommended configuration:
# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
#
# Results appear in the GitHub Security tab (SARIF upload).
# Optional: set SEMGREP_APP_TOKEN secret for managed rules from semgrep.dev.
# Without a token, `semgrep ci` uses auto-detected rules (--config auto).

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: [main, phase-next]
  schedule:
    # Weekly scan: Tuesday 08:00 UTC
    - cron: "0 8 * * 2"

permissions:
  contents: read
  security-events: write  # required to upload SARIF to GitHub Security tab

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # Use the official Semgrep container image (always up-to-date CLI)
    container:
      image: semgrep/semgrep
    # Skip dependabot PRs — no secrets available.
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Run Semgrep and generate SARIF
        run: semgrep ci --sarif > semgrep.sarif || true
        # semgrep ci exits 1 when findings exist; `|| true` lets us upload SARIF
        # even when there are findings (upload-sarif will mark the check failed).
        env:
          # Uncomment to use managed rules from semgrep.dev:
          # SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_SEND_METRICS: "off"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2de871e5a09832bc6a81e7276941f  # v3
        if: always()
        with:
          sarif_file: semgrep.sarif
