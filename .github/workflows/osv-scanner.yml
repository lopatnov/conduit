name: OSV Scanner

# OSV-Scanner checks Cargo.lock against the OSV vulnerability database.
# Finds known CVEs in dependencies before they affect production.

on:
  push:
    branches: [main]   # post-merge scan on main only; PR already covers feature branches
  pull_request:
    branches: [main]
  schedule:
    # Daily scan at 07:00 UTC to catch newly published vulnerabilities.
    - cron: "0 7 * * *"

concurrency:
  group: osv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write  # required to upload SARIF to GitHub Security tab
  actions: read

jobs:
  osv-scan:
    name: OSV Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSV-Scanner
        # Action lives in the osv-scanner-action/ subdirectory of the repo
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --format=sarif
            --output=osv-results.sarif
        continue-on-error: true  # Don't block CI — report findings to Security tab

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v3
        if: always()
        with:
          sarif_file: osv-results.sarif
