name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/conduit

jobs:
  # ── 1. Build native binaries for all targets ─────────────────────────────
  build:
    name: Build ${{ matrix.bundle }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── full: every optional feature. The unsuffixed asset (and the npm package, and `:latest`). ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-x86_64-unknown-linux-gnu
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-x86_64-unknown-linux-musl
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-aarch64-unknown-linux-gnu
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-aarch64-unknown-linux-musl
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-x86_64-apple-darwin
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-aarch64-apple-darwin
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-x86_64-pc-windows-msvc.exe
            archive_ext: zip

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false
            bundle: full
            features: "full"
            no_default_features: false
            asset_name: conduit-aarch64-pc-windows-msvc.exe
            archive_ext: zip

          # ── standard (`standard` feature bundle: jwt, consumers, forward-auth, cache, acme — see Cargo.toml
          # [features]): asset names end in "-standard". Also built for RISC-V, which has no other build. ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-x86_64-unknown-linux-gnu-standard
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-x86_64-unknown-linux-musl-standard
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-aarch64-unknown-linux-gnu-standard
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-aarch64-unknown-linux-musl-standard
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-x86_64-apple-darwin-standard
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-aarch64-apple-darwin-standard
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-x86_64-pc-windows-msvc-standard.exe
            archive_ext: zip

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-aarch64-pc-windows-msvc-standard.exe
            archive_ext: zip

          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bundle: standard
            features: "standard"
            no_default_features: false
            asset_name: conduit-riscv64gc-unknown-linux-gnu-standard
            archive_ext: tar.gz


          # ── gateway (`--no-default-features --features gateway`): the API-gateway bundle, no static files and no
          # live reload. Asset names end in "-gateway". ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-x86_64-unknown-linux-gnu-gateway
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-x86_64-unknown-linux-musl-gateway
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-aarch64-unknown-linux-gnu-gateway
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-aarch64-unknown-linux-musl-gateway
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-x86_64-apple-darwin-gateway
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-aarch64-apple-darwin-gateway
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-x86_64-pc-windows-msvc-gateway.exe
            archive_ext: zip

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false
            bundle: gateway
            features: "gateway"
            no_default_features: true
            asset_name: conduit-aarch64-pc-windows-msvc-gateway.exe
            archive_ext: zip

          # ── static (`--no-default-features --features static-server`): a file server that does not proxy. Asset
          # names end in "-static". ──
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-x86_64-unknown-linux-gnu-static
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-x86_64-unknown-linux-musl-static
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-aarch64-unknown-linux-gnu-static
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-aarch64-unknown-linux-musl-static
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-x86_64-apple-darwin-static
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-aarch64-apple-darwin-static
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-x86_64-pc-windows-msvc-static.exe
            archive_ext: zip

          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            use_cross: false
            bundle: static
            features: "static-server"
            no_default_features: true
            asset_name: conduit-aarch64-pc-windows-msvc-static.exe
            archive_ext: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ${{ matrix.target }}-${{ matrix.bundle }}

      # Install cross for cross-compilation targets
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2.88.0
        with:
          tool: cross

      # Build (native)
      - name: Build (native)
        if: "!matrix.use_cross"
        shell: bash
        run: |
          flags=""
          if [ "${{ matrix.no_default_features }}" = "true" ]; then flags="--no-default-features"; fi
          cargo build --release --target ${{ matrix.target }} $flags --features "${{ matrix.features }}"

      # Build (cross)
      - name: Build (cross)
        if: matrix.use_cross
        shell: bash
        run: |
          flags=""
          if [ "${{ matrix.no_default_features }}" = "true" ]; then flags="--no-default-features"; fi
          cross build --release --target ${{ matrix.target }} $flags --features "${{ matrix.features }}"

      # ---------- Package ----------

      - name: Package (tar.gz, Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/conduit dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist ${{ matrix.asset_name }}

      - name: Package (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\conduit.exe" "dist\${{ matrix.asset_name }}"
          Compress-Archive -Path "dist\${{ matrix.asset_name }}" -DestinationPath "dist\${{ matrix.asset_name }}.zip"

      # The Debian package (issue #669): the static musl full builds, for amd64 and arm64. A static binary needs no
      # libc, so one package installs on every Debian and Ubuntu release. It is uploaded as a `binary-*` artifact, so
      # it is attested, checksummed and attached to the release with the binaries.
      - name: Build the .deb package
        if: matrix.bundle == 'full' && endsWith(matrix.target, '-linux-musl')
        shell: bash
        run: |
          arch=amd64
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then arch=arm64; fi
          scripts/build-deb.sh "dist/${{ matrix.asset_name }}" "$arch" "${GITHUB_REF_NAME#v}" deb-out

      - name: Upload the .deb package
        if: matrix.bundle == 'full' && endsWith(matrix.target, '-linux-musl')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binary-deb-${{ matrix.target }}
          path: deb-out/*.deb
          if-no-files-found: error

      # Upload bare binary (used by npm postinstall).
      # The name carries the bundle, so the builds of one target get distinct
      # artifact names and don't overwrite each other; the npm job downloads
      # only `binary-full-*`.
      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binary-${{ matrix.bundle }}-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      # Upload archive (GitHub Release)
      - name: Upload archive artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: archive-${{ matrix.bundle }}-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # ── 1b. Attest build provenance (SLSA level 3) ──────────────────────────
  # Generates cryptographically signed provenance for every binary artifact.
  # Consumers can verify that binaries were built from this exact source commit
  # using: gh attestation verify <binary> --repo lopatnov/conduit
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for OIDC-based signing
      attestations: write   # required to create attestations

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x dist/conduit-*-linux-* dist/conduit-*-darwin* 2>/dev/null || true

      - name: Attest all binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

  # ── 2. Create GitHub Release with all archives ───────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download all archive artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: archive-*
          path: dist/
          merge-multiple: true

      # Also attach bare binaries so that npm's download.js fallback can
      # fetch the binary directly (without needing to unpack an archive).
      - name: Download all binary artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x dist/conduit-*-linux-* dist/conduit-*-darwin* 2>/dev/null || true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          name: "Conduit v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*

  # ── 3. Publish to crates.io ──────────────────────────────────────────────
  # Issue #114/#148: this now publishes every lopatnov-conduit-* workspace
  # member (~33 packages total, not just the root), in dependency order, via
  # native `cargo publish --workspace`. scripts/publish-workspace.sh skips
  # anything already published at the target version, so a re-run of this
  # job (e.g. after crates.io's new-crate rate limit stopped a first attempt
  # partway through) is safe to just re-trigger rather than needing a new
  # tag. concurrency here prevents two overlapping runs (a manual re-run
  # racing the original) from publishing the same crate twice in parallel.
  #
  # crates.io allows a burst of 5 brand-new crates and then one every 10
  # minutes (new versions of existing crates: burst of 30, then one per
  # minute), so a first release of 33 crates needs ~5 hours. The retry helper
  # sleeps until the time crates.io states in its 429 answer and carries on;
  # if the 6 h job limit is reached, run the "Publish crates (resume)"
  # workflow for the tag.
  publish-crates:
    name: Publish to crates.io (workspace)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: publish-crates
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3

      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          # Plain output: the retry helper greps cargo's text for the 429 answer.
          CARGO_TERM_COLOR: never
        run: ./scripts/publish-workspace-retry.sh .

  # ── 4. Publish the Docker images to GHCR, one image per bundle for amd64 and arm64 ─────────────────────────
  # Each architecture is built on a runner of that architecture (no emulation: compiling Rust under QEMU takes
  # hours) and pushed by digest, then `docker-manifest` joins the two into one multi-architecture image under
  # the tags. The full image owns the plain tags (`:latest`, `:X.Y.Z`, `:X.Y`); every other image carries its
  # bundle name as a suffix (`:latest-standard`, `:X.Y.Z-gateway`, ...). Each per-architecture image is scanned
  # with Trivy right after it is pushed.
  docker:
    name: Docker image (${{ matrix.bundle }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: full
            features: full
            no_default_features: ""
            arch: amd64
            runner: ubuntu-latest
          - bundle: full
            features: full
            no_default_features: ""
            arch: arm64
            runner: ubuntu-24.04-arm
          - bundle: standard
            features: standard
            no_default_features: ""
            arch: amd64
            runner: ubuntu-latest
          - bundle: standard
            features: standard
            no_default_features: ""
            arch: arm64
            runner: ubuntu-24.04-arm
          - bundle: gateway
            features: gateway
            no_default_features: "true"
            arch: amd64
            runner: ubuntu-latest
          - bundle: gateway
            features: gateway
            no_default_features: "true"
            arch: arm64
            runner: ubuntu-24.04-arm
          - bundle: static
            features: static-server
            no_default_features: "true"
            arch: amd64
            runner: ubuntu-latest
          - bundle: static
            features: static-server
            no_default_features: "true"
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Only the labels of this step are used; the tags come from `docker-manifest`.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: contrib/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FEATURES=${{ matrix.features }}
            NO_DEFAULT_FEATURES=${{ matrix.no_default_features }}

      - name: Scan the image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          version: 'v0.71.0'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: digests-${{ matrix.bundle }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── 4a. Join the two architectures of each image into one multi-architecture manifest ─────────────────────
  docker-manifest:
    name: Docker manifest (${{ matrix.bundle }})
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - bundle: full
            tag_suffix: ""
            latest_tag: latest
          - bundle: standard
            tag_suffix: "-standard"
            latest_tag: latest-standard
          - bundle: gateway
            tag_suffix: "-gateway"
            latest_tag: latest-gateway
          - bundle: static
            tag_suffix: "-static"
            latest_tag: latest-static

    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: digests-${{ matrix.bundle }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Without this the action adds a plain `latest` tag by itself (flavor latest=auto) to every image of the
          # matrix, and the four jobs would race for it. Only the explicit raw tag below sets `latest`.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ matrix.tag_suffix }}
            # A prerelease tag (v2.2.0-rc.1) must not move the `latest*` tags, as the release job's `prerelease:` says.
            type=raw,value=${{ matrix.latest_tag }},enable=${{ !contains(github.ref_name, '-') }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and push it
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect the image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  # ── 5. Publish to npm + GitHub Packages ─────────────────────────────────
  publish-npm:
    name: Publish to npm + GitHub Packages
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for npm provenance attestation (Trusted Publisher)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Download all bare binaries so we can vendor them into the npm package.
      # This way `npx conduit` works offline and without a postinstall network hit
      # if the user already has the matching platform binary cached by npm.
      - name: Download the full-build binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binary-full-*
          path: npm/bin/native/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x npm/bin/native/conduit-*-linux-* npm/bin/native/conduit-*-darwin* 2>/dev/null || true

      # download.js verifies its fallback download against these hashes (#571).
      - name: Write npm/bin/checksums.json
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          d = pathlib.Path("npm/bin/native")
          sums = {f.name: hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in sorted(d.iterdir()) if f.is_file()}
          assert sums, "no binaries found to checksum"
          pathlib.Path("npm/bin/checksums.json").write_text(json.dumps(sums, indent=2) + "\n")
          print(json.dumps(sums, indent=2))
          PY

      - name: Set package version
        working-directory: npm
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('package version set to', p.version);
          "

      # ── 4a. Publish to npmjs.com ────────────────────────────────────────
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npmjs.com
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # ── 4b. Publish to GitHub Packages ─────────────────────────────────
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
