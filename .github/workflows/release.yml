name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/conduit

jobs:
  # ── 1. Build native binaries for all targets ─────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Standard builds (no optional features) ──────────────────────────
          # Linux x86-64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            features: ""
            asset_name: conduit-x86_64-unknown-linux-gnu
            archive_ext: tar.gz

          # Linux x86-64 (musl — for Docker FROM scratch)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            features: ""
            asset_name: conduit-x86_64-unknown-linux-musl
            archive_ext: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            features: ""
            asset_name: conduit-aarch64-unknown-linux-gnu
            archive_ext: tar.gz

          # Linux RISC-V 64 (standard build only)
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            features: ""
            asset_name: conduit-riscv64gc-unknown-linux-gnu
            archive_ext: tar.gz

          # macOS x86-64
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            features: ""
            asset_name: conduit-x86_64-apple-darwin
            archive_ext: tar.gz

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            features: ""
            asset_name: conduit-aarch64-apple-darwin
            archive_ext: tar.gz

          # Windows x86-64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            features: ""
            asset_name: conduit-x86_64-pc-windows-msvc.exe
            archive_ext: zip

          # ── Full builds (all 13 optional features) ──────────────────────────
          # Identical targets, asset_name gains a "-full" suffix.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            features: "full"
            asset_name: conduit-x86_64-unknown-linux-gnu-full
            archive_ext: tar.gz

          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            features: "full"
            asset_name: conduit-x86_64-unknown-linux-musl-full
            archive_ext: tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            features: "full"
            asset_name: conduit-aarch64-unknown-linux-gnu-full
            archive_ext: tar.gz

          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            features: "full"
            asset_name: conduit-x86_64-apple-darwin-full
            archive_ext: tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            features: "full"
            asset_name: conduit-aarch64-apple-darwin-full
            archive_ext: tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            features: "full"
            asset_name: conduit-x86_64-pc-windows-msvc-full.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1
        with:
          key: ${{ matrix.target }}

      # Install cross for cross-compilation targets
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@56545b37b57562edd73171cb6c62cc509db4c34e  # v2.81.7
        with:
          tool: cross

      # Build (native)
      - name: Build (native)
        if: "!matrix.use_cross"
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cargo build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # Build (cross)
      - name: Build (cross)
        if: matrix.use_cross
        shell: bash
        run: |
          if [ -n "${{ matrix.features }}" ]; then
            cross build --release --target ${{ matrix.target }} --features "${{ matrix.features }}"
          else
            cross build --release --target ${{ matrix.target }}
          fi

      # ---------- Package ----------

      - name: Package (tar.gz, Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/conduit dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist ${{ matrix.asset_name }}

      - name: Package (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\conduit.exe" "dist\${{ matrix.asset_name }}"
          Compress-Archive -Path "dist\${{ matrix.asset_name }}" -DestinationPath "dist\${{ matrix.asset_name }}.zip"

      # Upload bare binary (used by npm postinstall).
      # Name uses asset_name (not target) so standard and full builds for the
      # same target get distinct artifact names and don't overwrite each other.
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: binary-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      # Upload archive (GitHub Release)
      - name: Upload archive artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: archive-${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # ── 1b. Attest build provenance (SLSA level 3) ──────────────────────────
  # Generates cryptographically signed provenance for every binary artifact.
  # Consumers can verify that binaries were built from this exact source commit
  # using: gh attestation verify <binary> --repo lopatnov/conduit
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # required for OIDC-based signing
      attestations: write   # required to create attestations

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x dist/conduit-*-linux-* dist/conduit-*-darwin* 2>/dev/null || true

      - name: Attest all binaries
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: "dist/*"

  # ── 2. Create GitHub Release with all archives ───────────────────────────
  github-release:
    name: GitHub Release
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Download all archive artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: archive-*
          path: dist/
          merge-multiple: true

      # Also attach bare binaries so that npm's download.js fallback can
      # fetch the binary directly (without needing to unpack an archive).
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x dist/conduit-*-linux-* dist/conduit-*-darwin* 2>/dev/null || true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          name: "Conduit v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*

  # ── 3. Publish to crates.io ──────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4  # v2.9.1

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

  # ── 4. Publish Docker image to GHCR ─────────────────────────────────────
  docker:
    name: Publish Docker image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: contrib/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Standard image: no optional features

  # ── 4a. Publish Docker image (full features) to GHCR ────────────────────
  docker-full:
    name: Publish Docker image (full features) to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Full-featured image uses a "-full" suffix on all tags.
          tags: |
            type=semver,pattern={{version}},suffix=-full
            type=semver,pattern={{major}}.{{minor}},suffix=-full
            type=raw,value=latest-full

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (all features)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7
        with:
          context: .
          file: contrib/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FEATURES=full

  # ── 4b. Vulnerability scan (Trivy) ───────────────────────────────────────
  docker-scan:
    name: Vulnerability scan — standard image (Trivy)
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.docker.outputs.version }}
          version: '0.71.0'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  docker-full-scan:
    name: Vulnerability scan — full image (Trivy)
    needs: docker-full
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan full image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ needs.docker-full.outputs.version }}
          version: '0.71.0'
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ── 5. Publish to npm + GitHub Packages ─────────────────────────────────
  publish-npm:
    name: Publish to npm + GitHub Packages
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write   # required for npm provenance attestation (Trusted Publisher)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Download all bare binaries so we can vendor them into the npm package.
      # This way `npx conduit` works offline and without a postinstall network hit
      # if the user already has the matching platform binary cached by npm.
      - name: Download all binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: binary-*
          path: npm/bin/native/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x npm/bin/native/conduit-*-linux-* npm/bin/native/conduit-*-darwin* 2>/dev/null || true

      - name: Set package version
        working-directory: npm
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('package version set to', p.version);
          "

      # ── 4a. Publish to npmjs.com ────────────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npmjs.com
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      # ── 4b. Publish to GitHub Packages ─────────────────────────────────
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish --access public
