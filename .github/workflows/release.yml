name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 1. Build native binaries for all targets ─────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86-64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            asset_name: conduit-x86_64-unknown-linux-gnu
            archive_ext: tar.gz

          # Linux x86-64 (musl — for Docker FROM scratch)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            asset_name: conduit-x86_64-unknown-linux-musl
            archive_ext: tar.gz

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            asset_name: conduit-aarch64-unknown-linux-gnu
            archive_ext: tar.gz

          # macOS x86-64
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
            asset_name: conduit-x86_64-apple-darwin
            archive_ext: tar.gz

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            asset_name: conduit-aarch64-apple-darwin
            archive_ext: tar.gz

          # Windows x86-64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            asset_name: conduit-x86_64-pc-windows-msvc.exe
            archive_ext: zip

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8
        with:
          key: ${{ matrix.target }}

      # Install cross for cross-compilation targets
      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c  # v2.49.0
        with:
          tool: cross

      # Build (native)
      - name: Build (native)
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      # Build (cross)
      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      # ---------- Package ----------

      - name: Package (tar.gz, Unix)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/conduit dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }}
          tar -czf dist/${{ matrix.asset_name }}.tar.gz -C dist ${{ matrix.asset_name }}

      - name: Package (zip, Windows)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\conduit.exe" "dist\${{ matrix.asset_name }}"
          Compress-Archive -Path "dist\${{ matrix.asset_name }}" -DestinationPath "dist\${{ matrix.asset_name }}.zip"

      # Upload bare binary (used by npm postinstall)
      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

      # Upload archive (GitHub Release)
      - name: Upload archive artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/${{ matrix.asset_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # ── 2. Create GitHub Release with all archives ───────────────────────────
  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Download all archive artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          pattern: archive-*
          path: dist/
          merge-multiple: true

      # Also attach bare binaries so that npm's download.js fallback can
      # fetch the binary directly (without needing to unpack an archive).
      - name: Download all binary artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          pattern: binary-*
          path: dist/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x dist/conduit-*-linux-* dist/conduit-*-darwin* 2>/dev/null || true

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8  # v2.3.2
        with:
          name: "Conduit v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/*

  # ── 3. Publish to crates.io ──────────────────────────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6  # v2.7.8

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --no-verify

  # ── 4. Publish to npm ────────────────────────────────────────────────────
  publish-npm:
    name: Publish to npm
    needs: github-release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Download all bare binaries so we can vendor them into the npm package.
      # This way `npx conduit` works offline and without a postinstall network hit
      # if the user already has the matching platform binary cached by npm.
      - name: Download all binary artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e  # v4.2.1
        with:
          pattern: binary-*
          path: npm/bin/native/
          merge-multiple: true

      - name: Set executable bit on Unix binaries
        run: chmod +x npm/bin/native/conduit-*-linux-* npm/bin/native/conduit-*-darwin* 2>/dev/null || true

      - name: Set package version
        working-directory: npm
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Publish npm package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
