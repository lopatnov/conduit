# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/

[advisories]

# No advisories are ignored.
#
# History: RUSTSEC-2024-0437 (protobuf 2.28.0, uncontrolled recursion) used to
# be ignored here. pingora-core 0.8 depended on prometheus 0.13.4, which needs
# protobuf ^2, and the fix (protobuf >=3.7.2) is not available on that API.
# Pingora 0.9 no longer depends on prometheus from pingora-core, so Cargo.lock
# holds only protobuf 3.7.2 (via Conduit's own prometheus 0.14) and the ignore
# was removed. If an advisory ever needs to be accepted again, add it below
# with the reason, the tracking link and a revisit date — never a bare id.
ignore = []
