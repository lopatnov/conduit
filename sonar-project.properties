# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=lopatnov_conduit

sonar.projectKey=lopatnov_conduit
sonar.organization=lopatnov

# Source and test roots
# crates/ holds workspace member crates (#114/#126, starting with
# conduit-core) -- their src/ trees need scanning too, not just the root
# package's.
sonar.sources=src,crates
sonar.tests=tests

# Coverage report generated by cargo-llvm-cov (--lcov --output-path coverage.lcov)
sonar.rust.lcov.reportPaths=coverage.lcov

# Exclude generated / vendored / example / config code from analysis
sonar.exclusions=\
  target/**,\
  benches/**,\
  examples/**,\
  schema/**,\
  npm/**,\
  contrib/**,\
  demo/**

# Exclude from coverage:
# - Entry points (thin wrappers, no business logic)
# - Async server infrastructure (hard to unit-test, covered by integration tests)
# - Generated code and thin adapters
# - proxy/{service,request_phase,response_phase,logging_phase}.rs and other
#   files that are ENTIRELY glue around a live pingora_proxy::Session/Axum
#   state/running server, with zero #[cfg(test)] unit tests of their own:
#   exercised only by tests/*.rs integration tests (real server + reqwest),
#   never by the --lib-only unit-test run that produces coverage.lcov via
#   cargo-llvm-cov (see sonar.yml). Without this, SonarCloud's PR-diff "new
#   code" coverage flags any future move/split of this code as a gate
#   failure even though behavior/tests are unchanged.
# IMPORTANT: a file can have BOTH untestable Session-glue AND substantial
# real #[cfg(test)] coverage for its pure-logic functions (path
# sanitization, log-injection protection, etc.) in the same file — e.g.
# handler/static_files.rs, filter/logging.rs, admin/api.rs, util/log_writer.rs
# are NOT excluded here despite having Session-touching code, because
# excluding the whole file would blind the gate to regressions in the parts
# that ARE genuinely unit-tested. Only add a file here once verified to have
# zero #[test] items anywhere in it (`grep -c '#\[test\]' <file>`) — see
# PR #180, 2026-08-11, which also deleted the stale, unrelated
# .tarpaulin.toml (a config file for `cargo tarpaulin`, a tool this repo's
# CI has never run — sonar.yml uses `cargo llvm-cov --lib`. That file had
# drifted badly since repo init and nearly caused this same file-level-
# coverage mistake by looking like a source of truth for this list).
#
# 7 files removed 2026-08-17 (issue #181): init.rs/tls.rs/service.rs/
# cache_disk.rs/cache_redis.rs/hot_reload.rs/kubernetes.rs were excluded
# despite having 85 #[test] items between them -- PR #180 only fixed a
# newly-proposed addition, not this pre-existing drift. Verified via a
# local `cargo llvm-cov --lib --features full` run (same data sonar.yml's
# coverage.lcov is generated from) that each file's real line coverage
# is 57-85%, not the near-zero "90% Session-glue" case this list exists
# to protect against -- exactly the pattern the paragraph above already
# describes for static_files.rs/logging.rs/admin/api.rs/log_writer.rs.
#
# 8 cli files added 2026-08-23 (PR #263): src/main.rs (already excluded
# above) was split into per-command modules -- serve.rs, validate.rs,
# fmt.rs, probe.rs, admin_client.rs, status.rs, upstream_urls.rs,
# config_path.rs -- for the same reason main.rs was excluded in the first
# place: this is CLI entry-point glue exercised only by tests/cli.rs
# subprocess integration tests (several paths call std::process::exit,
# which a --lib unit test can't safely exercise), never by the --lib-only
# unit-test run. Verified zero #[test] items in any of the 8 files
# (`grep -c '#\[test\]' <file>.rs`) before adding.
#
# All 8 plus the 4 src/server/*.rs entries moved to their new paths under
# crates/conduit-cli/src/ and crates/conduit-server/src/server/ (issue
# #147): same files, same zero-test-coverage reasoning, just relocated out
# of the root crate. dispatch.rs is new at that path but not new in kind --
# it is `src/main.rs`'s `dispatch_command()`/`Command` struct table, pulled
# out into its own file in the new crate; it was covered by the `src/
# main.rs` exclusion before and needs its own line now that it isn't part
# of that file any more.
#
# Fixed 2026-09-27 (issue #114/#148, final workspace-migration sync pass):
# `src/proxy/request_phase.rs` and `src/proxy/logging_phase.rs`/
# `response_phase.rs` no longer exist at those paths at all -- removed, not
# renamed in place, so their old lines below were silent no-ops (SonarCloud
# glob-matches nothing and skips them quietly). The real successors:
#   - `src/proxy/request_phase.rs` was later split again into
#     `crates/conduit-runtime/src/proxy/request/*.rs` (issue #143 prep,
#     PR #432/#442) -- of those, only body.rs/cache.rs/filter.rs are still
#     zero-#[test] Session-glue (verified via `grep -c '#\[test\]'`);
#     mod.rs/dns.rs/handlers.rs/peer.rs/retry.rs/transform.rs all carry real
#     #[cfg(test)] coverage now and are deliberately NOT added here.
#   - `crates/conduit-runtime/src/proxy/logging_phase.rs` (401 lines, 0
#     tests) is the same file this list already covered before the #145
#     move, just relocated -- added at its new path.
#   - `crates/conduit-runtime/src/proxy/response_phase.rs` now has 8 real
#     `#[test]` items (added since the original exclusion) -- NOT re-added,
#     same "don't blind the gate to genuinely tested code" reasoning as the
#     paragraph above.
# `src/upload/server.rs` also no longer exists -- its real successor,
# `crates/conduit-upload/src/server.rs`, has 13 `#[test]` items and is
# likewise NOT re-added, for the same reason.
sonar.coverage.exclusions=\
  tests/**,\
  benches/**,\
  src/main.rs,\
  src/lib.rs,\
  crates/conduit-cli/src/admin_client.rs,\
  crates/conduit-cli/src/config_path.rs,\
  crates/conduit-cli/src/dispatch.rs,\
  crates/conduit-cli/src/fmt.rs,\
  crates/conduit-cli/src/probe.rs,\
  crates/conduit-cli/src/serve.rs,\
  crates/conduit-cli/src/status.rs,\
  crates/conduit-cli/src/upstream_urls.rs,\
  crates/conduit-cli/src/validate.rs,\
  crates/conduit-server/src/server/acme.rs,\
  crates/conduit-server/src/server/otel.rs,\
  crates/conduit-server/src/server/shutdown.rs,\
  crates/conduit-server/src/server/redirect.rs,\
  crates/conduit-runtime/src/proxy/logging_phase.rs,\
  crates/conduit-runtime/src/proxy/request/body.rs,\
  crates/conduit-runtime/src/proxy/request/cache.rs,\
  crates/conduit-runtime/src/proxy/request/filter.rs,\
  src/filter/rate_limit_redis.rs,\
  src/filter/limits.rs,\
  src/handler/acme_challenge.rs,\
  src/handler/fallback.rs,\
  src/handler/response.rs,\
  src/handler/metrics.rs
