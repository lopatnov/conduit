# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=lopatnov_conduit

sonar.projectKey=lopatnov_conduit
sonar.organization=lopatnov

# Source and test roots
sonar.sources=src
sonar.tests=tests

# Coverage report generated by cargo-llvm-cov (--lcov --output-path coverage.lcov)
sonar.rust.lcov.reportPaths=coverage.lcov

# Exclude generated / vendored / example / config code from analysis
sonar.exclusions=\
  target/**,\
  benches/**,\
  examples/**,\
  schema/**,\
  npm/**,\
  contrib/**,\
  demo/**

# Exclude from coverage:
# - Entry points (thin wrappers, no business logic)
# - Async server infrastructure (hard to unit-test, covered by integration tests)
# - Generated code and thin adapters
# - proxy/{service,request_phase,response_phase,logging_phase}.rs: ProxyHttp
#   hook bodies operating on a live pingora_proxy::Session, exercised by
#   tests/*.rs integration tests (real server + reqwest), not the --lib-only
#   unit-test run that produces coverage.lcov (see sonar.yml). Without this,
#   SonarCloud's PR-diff "new code" coverage flags any future move/split of
#   this code as a gate failure even though behavior/tests are unchanged.
sonar.coverage.exclusions=\
  tests/**,\
  benches/**,\
  src/main.rs,\
  src/cli/init.rs,\
  src/server/acme.rs,\
  src/server/otel.rs,\
  src/server/shutdown.rs,\
  src/server/redirect.rs,\
  src/server/tls.rs,\
  src/proxy/service.rs,\
  src/proxy/request_phase.rs,\
  src/proxy/response_phase.rs,\
  src/proxy/logging_phase.rs,\
  src/proxy/cache_disk.rs,\
  src/proxy/cache_redis.rs,\
  src/filter/rate_limit_redis.rs,\
  src/handler/acme_challenge.rs,\
  src/handler/hot_reload.rs,\
  src/config/kubernetes.rs,\
  src/upload/server.rs
