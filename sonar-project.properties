# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=lopatnov_conduit

sonar.projectKey=lopatnov_conduit
sonar.organization=lopatnov

# Source and test roots
sonar.sources=src
sonar.tests=tests

# Coverage report generated by cargo-tarpaulin (--out Lcov)
sonar.rust.lcov.reportPaths=coverage/lcov.info

# Exclude generated / vendored / example code from analysis
sonar.exclusions=target/**,benches/**,examples/**,schema/**,npm/**,contrib/**
sonar.coverage.exclusions=tests/**,benches/**
