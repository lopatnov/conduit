# SonarCloud project configuration
# https://sonarcloud.io/project/overview?id=lopatnov_conduit

sonar.projectKey=lopatnov_conduit
sonar.organization=lopatnov

# Source and test roots
sonar.sources=src
sonar.tests=tests

# Coverage report generated by cargo-tarpaulin (--out Lcov)
sonar.rust.lcov.reportPaths=coverage/lcov.info

# Exclude generated / vendored / example code from analysis
sonar.exclusions=target/**,benches/**,examples/**,schema/**,npm/**,contrib/**
sonar.coverage.exclusions=tests/**,benches/**,src/main.rs,src/cli/**,src/server/**,src/upload/**,src/admin/api.rs,src/proxy/service.rs,src/handler/response.rs,src/handler/static_files.rs,src/handler/fallback.rs,src/handler/metrics.rs,src/handler/hot_reload.rs,src/util/log_writer.rs,src/filter/limits.rs,src/filter/logging.rs,src/proxy/cache_redis.rs,src/filter/rate_limit_redis.rs,src/handler/acme_challenge.rs
